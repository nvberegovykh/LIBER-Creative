name: REVEX r24 release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/revex-r24-release.yml'

permissions:
  contents: write

concurrency:
  group: revex-r24-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact 0.8.4 package
        shell: bash
        run: |
          set -euo pipefail
          URL='https://drive.usercontent.google.com/download?id=10RClkHuwaeq6_QqEbQuMYGCik3wbqFCk&export=download&confirm=t'
          curl -L --fail --retry 4 --retry-delay 2 "$URL" -o /tmp/LIBER_REVEX_0.8.4_NORMAL_PACKAGE.zip
          test "$(stat -c%s /tmp/LIBER_REVEX_0.8.4_NORMAL_PACKAGE.zip)" -gt 100000
          unzip -t /tmp/LIBER_REVEX_0.8.4_NORMAL_PACKAGE.zip >/dev/null

      - name: Install r24 live Companion
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/revex-r24
          mkdir -p /tmp/revex-r24
          unzip -q /tmp/LIBER_REVEX_0.8.4_NORMAL_PACKAGE.zip -d /tmp/revex-r24
          SRC='/tmp/revex-r24/LIBER_REVEX_0.8.4/src/Live-Companion'
          DST='docs/liber-apps/apps/revex'
          test -f "$SRC/index.html"
          test -f "$SRC/viewer-r24.js"
          test -f "$SRC/history-r24.js"
          test -f "$SRC/sync-docs-r24.js"
          mkdir -p "$DST"
          rsync -a --exclude='README.txt' --exclude='liber-apps-integration.patch' "$SRC/" "$DST/"

      - name: Align LIBER Apps launcher
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('docs/liber-apps/js/apps.js')
          s = p.read_text(encoding='utf-8')
          pat = re.compile(r"(id:\s*'revex'[\s\S]{0,700}?version:\s*')[^']+('[\s\S]{0,700}?lastUpdated:\s*')[^']+(')")
          s2, n = pat.subn(r"\g<1>0.8.4\g<2>2026-08-10\g<3>", s, count=1)
          if n != 1:
              raise SystemExit('Could not update REVEX launcher metadata exactly once')
          p.write_text(s2, encoding='utf-8')
          PY

      - name: Static QA
        shell: bash
        run: |
          set -euo pipefail
          cp docs/liber-apps/apps/revex/app.js /tmp/revex-app.mjs
          cp docs/liber-apps/apps/revex/store.js /tmp/revex-store.mjs
          cp docs/liber-apps/apps/revex/viewer-r24.js /tmp/revex-viewer.mjs
          cp docs/liber-apps/apps/revex/history-r24.js /tmp/revex-history.mjs
          cp docs/liber-apps/apps/revex/sync-docs-r24.js /tmp/revex-syncdocs.mjs
          node --check /tmp/revex-app.mjs
          node --check /tmp/revex-store.mjs
          node --check /tmp/revex-viewer.mjs
          node --check /tmp/revex-history.mjs
          node --check /tmp/revex-syncdocs.mjs
          node --check docs/liber-apps/apps/revex/runtime.js
          node --check docs/liber-apps/apps/revex/render-agent.js
          node --check docs/liber-apps/apps/revex/wallt-agent.js
          node --check docs/liber-apps/apps/revex/shell-integrity.js
          grep -q '20260810r24' docs/liber-apps/apps/revex/index.html
          grep -q 'viewer-r24.js' docs/liber-apps/apps/revex/index.html
          grep -q 'history-r24.js' docs/liber-apps/apps/revex/index.html
          grep -q 'sync-docs-r24.js' docs/liber-apps/apps/revex/index.html
          grep -q "version: '0.8.4'" docs/liber-apps/js/apps.js
          grep -q "launchId = 'revex'" docs/liber-apps/js/apps.js
          grep -q "view=spec" docs/liber-apps/js/apps.js
          grep -q 'body.embedded' docs/liber-apps/apps/specifications/styles.css
          grep -q "qs.get('embedded')" docs/liber-apps/apps/specifications/app.js

      - name: Commit live release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'REVEX release bot'
          git config user.email 'revex-release@users.noreply.github.com'
          git add docs/liber-apps/apps/revex docs/liber-apps/js/apps.js
          if git diff --cached --quiet; then
            echo 'r24 content already live in main'
            exit 0
          fi
          git commit -m 'REVEX Companion r24 live release'
          git push origin HEAD:main
