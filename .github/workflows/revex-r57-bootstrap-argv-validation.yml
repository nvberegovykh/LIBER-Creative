name: REVEX r57 bootstrap argv validation

on:
  push:
    branches:
      - main
      - 'agent/revex-deploy-bootstrap-argv-r57-*'
      - 'agent/revex-deploy-single-account-count-r58-*'
      - 'agent/revex-auto-firebase-auth-r59-*'
    paths:
      - 'DEPLOY_REVEX_CURRENT_SERVICES.ps1'
      - 'DEPLOY_REVEX_CURRENT_SERVICES_BOOTSTRAP.ps1'
      - 'server/revex-energy-worker/DEPLOY_ENERGY_CURRENT.ps1'
      - 'server/revex-render-worker/DEPLOY_RENDER_SERVER.ps1'
      - '.github/workflows/revex-r57-bootstrap-argv-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'DEPLOY_REVEX_CURRENT_SERVICES.ps1'
      - 'DEPLOY_REVEX_CURRENT_SERVICES_BOOTSTRAP.ps1'
      - 'server/revex-energy-worker/DEPLOY_ENERGY_CURRENT.ps1'
      - 'server/revex-render-worker/DEPLOY_RENDER_SERVER.ps1'
      - '.github/workflows/revex-r57-bootstrap-argv-validation.yml'

jobs:
  windows-bootstrap:
    name: Windows bootstrap preserves native argv
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse launchers and validate bootstrap transformation
        shell: powershell
        run: |
          $files = @(
            '.\DEPLOY_REVEX_CURRENT_SERVICES.ps1',
            '.\DEPLOY_REVEX_CURRENT_SERVICES_BOOTSTRAP.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if (@($errors).Count -gt 0) {
              $messages = @($errors | ForEach-Object { $_.Message }) -join '; '
              throw "PowerShell parser rejected ${file}: $messages"
            }
          }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\DEPLOY_REVEX_CURRENT_SERVICES_BOOTSTRAP.ps1 -ValidateOnly -NoPause
          if ($LASTEXITCODE -ne 0) { throw 'Bootstrap validation failed.' }
      - name: Prove explicit gcloud flag/value arguments stay separate
        shell: powershell
        run: |
          $fake = Join-Path $env:RUNNER_TEMP 'fake-gcloud.cmd'
          @'
          @echo off
          echo [%1][%2][%3][%4][%5][%6]
          '@ | Set-Content -LiteralPath $fake -Encoding Ascii
          $arguments = @('auth','list','--filter','status:ACTIVE','--format','value(account)')
          $actual = (& $fake @arguments | Out-String).Trim()
          $expected = '[auth][list][--filter][status:ACTIVE][--format][value(account)]'
          if ($actual -ne $expected) {
            throw "Native argv collapsed: $actual"
          }
      - name: Prove one active account survives StrictMode scalar unwrapping
        shell: powershell
        run: |
          Set-StrictMode -Version 3.0
          $single = 'admin@example.com'
          if (@($single).Count -ne 1) { throw 'Scalar account did not normalize to one item.' }
          $selected = [string](@($single)[0])
          if ($selected -ne 'admin@example.com') { throw "Scalar account indexing corrupted the account: $selected" }
          $bootstrap = Get-Content -Raw .\DEPLOY_REVEX_CURRENT_SERVICES_BOOTSTRAP.ps1
          foreach ($required in @(
            '@($active).Count',
            'Replace(''$active.Count'', ''@($active).Count'')',
            'Replace(''$accounts.Count'', ''@($accounts).Count'')',
            'Replace(''[string]$active[0]'', ''[string](@($active)[0])'')',
            'Replace(''[string]$accounts[0]'', ''[string](@($accounts)[0])'')'
          )) {
            if (-not $bootstrap.Contains($required)) { throw "Bootstrap is missing scalar-account hardening: $required" }
          }
      - name: Require automatic interactive auth recovery and persistent logs
        shell: powershell
        run: |
          $launcher = Get-Content -Raw .\DEPLOY_REVEX_CURRENT_SERVICES.ps1
          foreach ($required in @(
            '& $Firebase login --reauth',
            'deployment will resume automatically after approval',
            '& $GCloud auth login',
            'DEPLOY_REVEX_CURRENT_SERVICES.latest.log',
            'Start-Transcript'
          )) {
            if (-not $launcher.Contains($required)) { throw "Managed launcher is missing auth/logging contract: $required" }
          }
      - name: Preserve REVEX renderer Energy and viewer contracts
        shell: powershell
        run: |
          node .github/scripts/verify-revex-current-generation-r53.js
          node .github/scripts/verify-revex-r54-selfhost-render.js
