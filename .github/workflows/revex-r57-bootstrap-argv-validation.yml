name: REVEX r57 bootstrap argv validation

on:
  push:
    branches:
      - main
      - 'agent/revex-deploy-bootstrap-argv-r57-*'
      - 'agent/revex-deploy-single-account-count-r58-*'
      - 'agent/revex-auto-firebase-auth-r59-*'
      - 'agent/revex-broker-docs-r64-*'
    paths:
      - 'DEPLOY_REVEX_CURRENT_SERVICES.cmd'
      - 'DEPLOY_REVEX_CURRENT_SERVICES.ps1'
      - 'DEPLOY_REVEX_CURRENT_SERVICES_BOOTSTRAP.ps1'
      - 'server/revex-report-functions/DEPLOY_REPORT_R126.ps1'
      - 'server/revex-render-worker/DEPLOY_RENDER_R126.ps1'
      - '.github/workflows/revex-r57-bootstrap-argv-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'DEPLOY_REVEX_CURRENT_SERVICES.cmd'
      - 'DEPLOY_REVEX_CURRENT_SERVICES.ps1'
      - 'DEPLOY_REVEX_CURRENT_SERVICES_BOOTSTRAP.ps1'
      - 'server/revex-report-functions/DEPLOY_REPORT_R126.ps1'
      - 'server/revex-render-worker/DEPLOY_RENDER_R126.ps1'
      - '.github/workflows/revex-r57-bootstrap-argv-validation.yml'

jobs:
  windows-bootstrap:
    name: Windows bootstrap preserves native argv
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse current r126 launchers and deployment primitives
        shell: powershell
        run: |
          $files = @(
            '.\DEPLOY_REVEX_CURRENT_SERVICES.ps1',
            '.\DEPLOY_REVEX_CURRENT_SERVICES_BOOTSTRAP.ps1',
            '.\server\revex-report-functions\DEPLOY_REPORT_R126.ps1',
            '.\server\revex-render-worker\DEPLOY_RENDER_R126.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if (@($errors).Count -gt 0) {
              $messages = @($errors | ForEach-Object { $_.Message }) -join '; '
              throw "PowerShell parser rejected ${file}: $messages"
            }
          }
          node .github/scripts/verify-revex-current-generation-r53.js
          node .github/scripts/verify-revex-r99-webview-root-cache.js
          node .github/scripts/verify-revex-r126-functional-convergence.js
      - name: Prove explicit gcloud flag/value arguments stay separate
        shell: powershell
        run: |
          $fake = Join-Path $env:RUNNER_TEMP 'fake-gcloud.cmd'
          @'
          @echo off
          echo [%1][%2][%3][%4][%5][%6]
          '@ | Set-Content -LiteralPath $fake -Encoding Ascii
          $arguments = @('auth','list','--filter','status:ACTIVE','--format','value(account)')
          $actual = (& $fake @arguments | Out-String).Trim()
          $expected = '[auth][list][--filter][status:ACTIVE][--format][value(account)]'
          if ($actual -ne $expected) { throw "Native argv collapsed: $actual" }
      - name: Prove one active account survives StrictMode scalar unwrapping
        shell: powershell
        run: |
          Set-StrictMode -Version 3.0
          $single = 'admin@example.com'
          if (@($single).Count -ne 1) { throw 'Scalar account did not normalize to one item.' }
          $selected = [string](@($single)[0])
          if ($selected -ne 'admin@example.com') { throw "Scalar account indexing corrupted the account: $selected" }
          $bootstrap = Get-Content -Raw .\DEPLOY_REVEX_CURRENT_SERVICES_BOOTSTRAP.ps1
          $launcher = Get-Content -Raw .\DEPLOY_REVEX_CURRENT_SERVICES.ps1
          if (-not $bootstrap.Contains('@($active).Count')) { throw 'Bootstrap is missing StrictMode-safe active-account normalization.' }
          if (-not $launcher.Contains('@($output).Count')) { throw 'Launcher is missing StrictMode-safe active-account normalization.' }
      - name: Require self-refresh gcloud recovery persistent logs and current-only scope
        shell: powershell
        run: |
          $cmd = Get-Content -Raw .\DEPLOY_REVEX_CURRENT_SERVICES.cmd
          $launcher = Get-Content -Raw .\DEPLOY_REVEX_CURRENT_SERVICES.ps1
          $bootstrap = Get-Content -Raw .\DEPLOY_REVEX_CURRENT_SERVICES_BOOTSTRAP.ps1

          foreach ($required in @(
            'raw.githubusercontent.com/nvberegovykh/LIBER-Creative/main/DEPLOY_REVEX_CURRENT_SERVICES.ps1',
            'REVEX current r126 managed-services deployment',
            'Energy was not changed by the current finalization path.',
            'pause >nul'
          )) {
            if (-not $cmd.Contains($required)) { throw "Managed .cmd launcher is missing current self-refresh contract: $required" }
          }
          foreach ($forbidden in @('DEPLOY_ENERGY_CURRENT.ps1','DEPLOY_ENERGY_WORKER_ONLY_R69.ps1','EnergyWorkerOnly','PUBLISH_REVEX_R49.ps1')) {
            if ($cmd.Contains($forbidden)) { throw "Managed .cmd launcher revives forbidden historical path: $forbidden" }
          }

          if (-not $launcher.Contains('Invoke-NativeExitCode $GCloud @("auth", "login")')) { throw 'Managed launcher is missing gcloud automatic login.' }
          foreach ($required in @('DEPLOY_REVEX_CURRENT_SERVICES.latest.log','Start-Transcript','Report + warm Render only')) {
            if (-not $launcher.Contains($required)) { throw "Managed launcher is missing current auth/logging contract: $required" }
          }
          foreach ($required in @('DEPLOY_REPORT_R126.ps1','DEPLOY_RENDER_R126.ps1','Verify root cache key matches the current UI BUILD','Verify r126 functional convergence')) {
            if (-not $bootstrap.Contains($required)) { throw "Current bootstrap missing r126 contract: $required" }
          }
          foreach ($forbidden in @('DEPLOY_ENERGY_CURRENT.ps1','DEPLOY_ENERGY_WORKER_ONLY_R69.ps1','EnergyWorkerOnly','PUBLISH_REVEX_R49.ps1')) {
            if ($launcher.Contains($forbidden) -or $bootstrap.Contains($forbidden)) { throw "Current deployment revives forbidden historical path: $forbidden" }
          }
      - name: Preserve REVEX current renderer Energy viewer and r126 contracts
        shell: powershell
        run: |
          node .github/scripts/verify-revex-current-generation-r53.js
          node .github/scripts/verify-revex-r54-selfhost-render.js
          node .github/scripts/verify-revex-r126-functional-convergence.js
