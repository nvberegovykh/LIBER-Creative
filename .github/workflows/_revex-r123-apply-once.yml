name: REVEX r123 apply package guarantee once
on:
  push:
    branches: [agent/revex-r123-package-guarantee]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic roof + package + tap-download guarantee
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if s.count(old)!=1:
                  raise SystemExit(f'{path}: expected exactly one marker, got {s.count(old)}')
              p.write_text(s.replace(old,new),encoding='utf-8')

          # 1) One physical roof: diagram regions own geometry only; approved same-envelope roof owns one thermal class.
          p=Path('server/revex-energy-worker/revex_reference_envelope_projection_r118.py')
          s=p.read_text(encoding='utf-8')
          old='''    reference_proven = bool(corroboration)\n\n    filled: list[dict] = []\n'''
          new='''    reference_proven = bool(corroboration)\n\n    # r123: R1/R2/R3/R4 are diagram regions of one physical roof, not independent\n    # roof constructions.  In recovery mode the current project keeps every roof\n    # region area/geometry, while the approved same-envelope reference supplies one\n    # roof thermal class.  Conflicting current roof thermal rows are therefore removed\n    # from the DERIVED facts only; immutable Engineering evidence is never mutated.\n    normalized_roof_codes: list[str] = []\n    if reference_proven and profiles.get("roof"):\n        roof_codes: set[str] = set()\n        for page in en_pages:\n            for row in list(page.get("envelope") or []):\n                if _text(row.get("kind")).lower() != "roof" or _number(row.get("grossAreaFt2")) is None:\n                    continue\n                code, _ = _row_code(row)\n                if not code:\n                    continue\n                roof_codes.add(code)\n                # Geometry rows remain geometry rows. Any embedded thermal numbers are\n                # stripped only in this derived projection so one approved class is used.\n                for key in ("uFactor", "shgc", "vt", "cavityR", "continuousR"):\n                    row[key] = None\n                row["referenceEnvelopeGeometryOnly"] = True\n\n        if roof_codes:\n            for page in en_pages:\n                kept = []\n                for row in list(page.get("envelope") or []):\n                    code, _ = _row_code(row)\n                    is_thermal_only_roof = (\n                        _text(row.get("kind")).lower() == "roof"\n                        and code in roof_codes\n                        and _number(row.get("grossAreaFt2")) is None\n                    )\n                    if not is_thermal_only_roof:\n                        kept.append(row)\n                page["envelope"] = kept\n\n            # Rebuild the derived row indexes after removing conflicting roof thermal rows.\n            rows = []\n            for page in en_pages:\n                for row in list(page.get("envelope") or []):\n                    if float(row.get("confidence") or 0) < MIN_CONFIDENCE:\n                        continue\n                    row["_sourceFile"] = page.get("sourceFile")\n                    rows.append(row)\n            thermal_rows = [row for row in rows if _has_any_thermal(row)]\n            geometry_rows = [row for row in rows if _number(row.get("grossAreaFt2")) is not None and not _has_any_thermal(row) and _text(row.get("kind")).lower() in {"roof", "floor", "wall", "window", "door"} and _row_code(row)[0]]\n            normalized_roof_codes = sorted(roof_codes)\n\n    filled: list[dict] = []\n'''
          if s.count(old)!=1: raise SystemExit('projection insertion marker mismatch')
          s=s.replace(old,new)
          old2='''        "referenceFamilyCorroborated": reference_proven, "corroboration": corroboration,\n'''
          new2='''        "referenceFamilyCorroborated": reference_proven, "corroboration": corroboration,\n        "roofDiagramRegionsNormalizedToOneThermalClass": normalized_roof_codes,\n'''
          if s.count(old2)!=1: raise SystemExit('projection audit marker mismatch')
          p.write_text(s.replace(old2,new2),encoding='utf-8')

          # 2) Package emission is unconditional at terminal boundary. Strict status is preserved.
          p=Path('server/revex-energy-worker/revex_energy_pipeline_guard_r118.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('from pathlib import Path\nfrom typing import Iterable\n','from pathlib import Path\nfrom typing import Iterable\nimport json\nimport sys\nimport zipfile\n')
          old='''def main(argv: Iterable[str] | None = None) -> int:\n    # r116 looks this function up from its module globals at execution time. Replace only\n    # that one downstream seam; every other r116 operation stays byte-for-byte intact.\n    r116._resolve_comcheck_evidence_request = _resolve_comcheck_evidence_then_reference\n    r116.PREFLIGHT_NAME = "COMCHECK_PREFLIGHT_R118.json"\n    base.EXACT_NAMES.update({\n        "REFERENCE_ENVELOPE_PROJECTION_R118.json",\n        "00_PAGE_FACTS_REFERENCE_ENVELOPE_R118.json",\n        "00_PIPELINE_REQUEST_REFERENCE_ENVELOPE_R118.json",\n        "COMCHECK_PREFLIGHT_R118.json",\n    })\n    return r116.main(argv)\n'''
          new='''PACKAGE_NAME = "REVEX_RECOVERY_PACKAGE.zip"\nPACKAGE_MANIFEST_NAME = "REVEX_RECOVERY_PACKAGE_MANIFEST.json"\n\n\ndef _request_path_from_argv(argv: Iterable[str] | None) -> Path | None:\n    values = list(argv) if argv is not None else list(sys.argv[1:])\n    for index, value in enumerate(values):\n        if value == "--request" and index + 1 < len(values):\n            return Path(values[index + 1]).resolve()\n    return None\n\n\ndef _ensure_recovery_package(request_path: Path) -> Path:\n    request = json.loads(Path(request_path).read_text(encoding="utf-8"))\n    output_root = Path(str(request.get("outputFolder") or "")).resolve()\n    output_root.mkdir(parents=True, exist_ok=True)\n    result_path = output_root / "energy-result.json"\n    if result_path.is_file():\n        result = json.loads(result_path.read_text(encoding="utf-8"))\n    else:\n        result = base.fallback_result(request, output_root, 2)\n\n    required = {\n        "BASELINE_UPDATED_GEOMETRY.osm", "PROPOSED_UPDATED_GEOMETRY.osm",\n        "EN-1_READY_TO_INSERT.xlsx", "COMcheck_PROJECT_INPUT_READY.cxl",\n        "COMcheck_OFFICIAL_BACKSTOP_REPORT.pdf", "COMcheck_BACKSTOP_RESULT.json",\n    }\n    present = {path.name for path in output_root.rglob("*") if path.is_file()}\n    allowed_suffixes = {".osm", ".html", ".xlsx", ".pdf", ".cxl", ".json", ".txt", ".log", ".zip", ".err"}\n    candidates: list[Path] = []\n    for path in sorted(output_root.rglob("*"), key=lambda item: item.as_posix().lower()):\n        if not path.is_file() or path.name in {PACKAGE_NAME, PACKAGE_MANIFEST_NAME, "energy-result.json"}:\n            continue\n        if path.suffix.lower() in allowed_suffixes or path.name.startswith(("NATIVE_CHECK_", "SPACE_MAPPING_REVIEW_")):\n            candidates.append(path)\n\n    guarantee = {\n        "schema": "liber.revex.energy-recovery-package.v1",\n        "sourceEngineeringRevision": request.get("revision"),\n        "pipelineStatus": str(result.get("status") or "UNKNOWN").upper(),\n        "strictComplete": str(result.get("status") or "").upper() == "COMPLETE",\n        "requiredStrictOutputsPresent": sorted(required & present),\n        "requiredStrictOutputsMissing": sorted(required - present),\n        "included": [path.resolve().relative_to(output_root).as_posix() for path in candidates],\n        "policy": "ALWAYS_EMIT_PACKAGE; STRICT_COMPLETE_STATUS_REMAINS_UNCHANGED",\n    }\n    result["packageGuarantee"] = guarantee\n    result_path.write_text(json.dumps(result, ensure_ascii=True, indent=2), encoding="utf-8")\n    manifest_path = output_root / PACKAGE_MANIFEST_NAME\n    manifest_path.write_text(json.dumps(guarantee, ensure_ascii=True, indent=2), encoding="utf-8")\n\n    package_path = output_root / PACKAGE_NAME\n    with zipfile.ZipFile(package_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:\n        for path in candidates + [manifest_path, result_path]:\n            archive.write(path, path.resolve().relative_to(output_root).as_posix())\n\n    row = {\n        "name": PACKAGE_NAME, "reviewName": "REVEX Energy Package",\n        "path": PACKAGE_NAME, "kind": "recovery-package", "userVisible": True,\n        "bytes": package_path.stat().st_size, "sha256": base.sha256(package_path),\n    }\n    result = json.loads(result_path.read_text(encoding="utf-8"))\n    result["artifacts"] = [item for item in list(result.get("artifacts") or []) if str(item.get("name") or "") != PACKAGE_NAME] + [row]\n    result["packageGuarantee"] = guarantee\n    result_path.write_text(json.dumps(result, ensure_ascii=True, indent=2), encoding="utf-8")\n    print(json.dumps({\n        "stage": "PACKAGE_GUARANTEE_R123", "status": "EMITTED",\n        "package": PACKAGE_NAME, "pipelineStatus": guarantee["pipelineStatus"],\n        "strictComplete": guarantee["strictComplete"], "includedFiles": len(candidates),\n        "missingStrictOutputs": guarantee["requiredStrictOutputsMissing"],\n    }, ensure_ascii=True), flush=True)\n    return package_path\n\n\ndef main(argv: Iterable[str] | None = None) -> int:\n    # r116 looks this function up from its module globals at execution time. Replace only\n    # that one downstream seam; every other r116 operation stays intact.\n    r116._resolve_comcheck_evidence_request = _resolve_comcheck_evidence_then_reference\n    r116.PREFLIGHT_NAME = "COMCHECK_PREFLIGHT_R118.json"\n    base.EXACT_NAMES.update({\n        "REFERENCE_ENVELOPE_PROJECTION_R118.json",\n        "00_PAGE_FACTS_REFERENCE_ENVELOPE_R118.json",\n        "00_PIPELINE_REQUEST_REFERENCE_ENVELOPE_R118.json",\n        "COMCHECK_PREFLIGHT_R118.json",\n        PACKAGE_MANIFEST_NAME,\n    })\n    request_path = _request_path_from_argv(argv)\n    try:\n        code = r116.main(argv)\n    except Exception as exc:\n        if request_path is None:\n            raise\n        request = json.loads(request_path.read_text(encoding="utf-8"))\n        output_root = Path(str(request.get("outputFolder") or "")).resolve()\n        output_root.mkdir(parents=True, exist_ok=True)\n        result = base.fallback_result(request, output_root, 2)\n        result["error"] = f"REVEX recovery boundary caught {type(exc).__name__}: {exc}"\n        result["failureContext"] = {"failedStage": "RECOVERY_BOUNDARY_R123", "type": type(exc).__name__, "message": str(exc)}\n        (output_root / "energy-result.json").write_text(json.dumps(result, ensure_ascii=True, indent=2), encoding="utf-8")\n        code = 2\n    if request_path is not None:\n        _ensure_recovery_package(request_path)\n    return int(code)\n'''
          if s.count(old)!=1: raise SystemExit('guard main marker mismatch')
          p.write_text(s.replace(old,new),encoding='utf-8')

          # 3) Regression: conflicting roof thermal rows must collapse to one approved class and package must emit on FAILED.
          p=Path('server/revex-energy-worker/verify_reference_envelope_r118.py')
          s=p.read_text(encoding='utf-8')
          marker='''rows += [\n    {"kind":"floor","assemblyType":"F2.1","description":"F2.1 Exposed exterior floor joist","orientation":None,"grossAreaFt2":120,"confidence":.99,"evidence":"F2.1 Exposed exterior floor"},\n    {"kind":"floor","assemblyType":"S1.1","description":"S1.1 Cellar slab on grade","orientation":None,"grossAreaFt2":130,"confidence":.99,"evidence":"S1.1 Cellar slab on grade"},\n]\n'''
          replacement=marker+'''# Live regression: one physical roof may be split into R1/R2/R3/R4 diagram regions\n# while current schedule fragments disagree. Recovery must normalize them to one approved roof class.\nrows += [\n    {"kind":"roof","assemblyType":"R1","description":"R1 current thermal fragment","grossAreaFt2":None,"cavityR":26.4,"continuousR":15.0,"confidence":.99,"evidence":"R1 R26.4 R15"},\n    {"kind":"roof","assemblyType":"R2","description":"R2 conflicting thermal fragment","grossAreaFt2":None,"cavityR":30.0,"continuousR":10.0,"confidence":.99,"evidence":"R2 R30 R10"},\n    {"kind":"roof","assemblyType":"R3","description":"R3 conflicting thermal fragment","grossAreaFt2":None,"cavityR":20.0,"continuousR":5.0,"confidence":.99,"evidence":"R3 R20 R5"},\n    {"kind":"roof","assemblyType":"R4","description":"R4 conflicting thermal fragment","grossAreaFt2":None,"cavityR":13.0,"continuousR":8.0,"confidence":.99,"evidence":"R4 R13 R8"},\n]\n'''
          if s.count(marker)!=1: raise SystemExit('verifier row marker mismatch')
          s=s.replace(marker,replacement)
          marker2='''    now={(r["kind"],r["assemblyType"],r.get("grossAreaFt2"),r.get("orientation")) for r in derived["pages"][0]["envelope"] if r.get("grossAreaFt2") is not None}\n    assert original == now\n\nsource=Path(__file__).with_name("revex_reference_envelope_projection_r118.py").read_text()\n'''
          replacement2='''    now={(r["kind"],r["assemblyType"],r.get("grossAreaFt2"),r.get("orientation")) for r in derived["pages"][0]["envelope"] if r.get("grossAreaFt2") is not None}\n    assert original == now\n    roof_geometry=[r for r in derived["pages"][0]["envelope"] if r.get("kind")=="roof" and r.get("grossAreaFt2") is not None]\n    roof_thermal=[r for r in derived["pages"][0]["envelope"] if r.get("kind")=="roof" and r.get("grossAreaFt2") is None]\n    assert len(roof_geometry)==4 and round(sum(float(r["grossAreaFt2"]) for r in roof_geometry),3)==406.0\n    signatures={(float(r.get("cavityR") or 0),float(r.get("continuousR") or 0)) for r in roof_thermal if ref._row_code(r)[0] in set(roof_codes)}\n    assert signatures=={(26.4,15.0)}, signatures\n    assert audit["roofDiagramRegionsNormalizedToOneThermalClass"]==roof_codes\n\n# Package is emitted even for terminal FAILED; status is not falsified to COMPLETE.\nwith tempfile.TemporaryDirectory() as td:\n    root=Path(td); out=root/"out"; out.mkdir()\n    request=root/"request.json"; request.write_text(json.dumps({"revision":"eng_pkg","projectId":"current","outputFolder":str(out)}),encoding="utf-8")\n    (out/"COMcheck_PROJECT_INPUT_READY.cxl").write_text("cxl",encoding="utf-8")\n    (out/"FAILURE_SUMMARY.txt").write_text("downstream failure",encoding="utf-8")\n    (out/"energy-result.json").write_text(json.dumps({"schema":"liber.revex.energy-result.v1","pipelineVersion":"0.8.19-r49","projectId":"current","sourceEngineeringRevision":"eng_pkg","status":"FAILED","artifacts":[],"revitWriteBack":False,"pdfInsertion":False}),encoding="utf-8")\n    package=guard._ensure_recovery_package(request); assert package.is_file()\n    result=json.loads((out/"energy-result.json").read_text())\n    assert result["status"]=="FAILED"\n    package_row=next(r for r in result["artifacts"] if r["name"]==guard.PACKAGE_NAME)\n    assert package_row["userVisible"] is True and package_row["kind"]=="recovery-package"\n    import zipfile\n    with zipfile.ZipFile(package) as z:\n        names=set(z.namelist())\n        assert "COMcheck_PROJECT_INPUT_READY.cxl" in names and "FAILURE_SUMMARY.txt" in names and guard.PACKAGE_MANIFEST_NAME in names\n\nsource=Path(__file__).with_name("revex_reference_envelope_projection_r118.py").read_text()\n'''
          if s.count(marker2)!=1: raise SystemExit('verifier assertion marker mismatch')
          p.write_text(s.replace(marker2,replacement2),encoding='utf-8')

          # 4) Entire package/artifact row is a reliable tap-to-download target.
          p=Path('docs/liber-apps/apps/revex/energy-r27.js'); s=p.read_text(encoding='utf-8')
          s=s.replace("const BUILD = '20260816r89-nine-output1';","const BUILD = '20260817r123-package-download1';")
          old='''    return row.url ? `<a class="energy-artifact${filing?' is-filing':''}" href="${esc(row.url)}" target="_blank" rel="noopener">${body}</a>` : `<div class="energy-artifact${filing?' is-filing':''}">${body}</div>`;\n'''
          new='''    const url=clean(row.url),name=clean(row.reviewName||row.name||'REVEX-artifact');\n    return url ? `<a class="energy-artifact${filing?' is-filing':''}" href="${esc(url)}" data-download-url="${esc(url)}" data-download-name="${esc(name)}" download="${esc(name)}" role="button" style="cursor:pointer;touch-action:manipulation">${body}</a>` : `<div class="energy-artifact${filing?' is-filing':''}">${body}</div>`;\n'''
          if s.count(old)!=1: raise SystemExit('energy row marker mismatch')
          s=s.replace(old,new)
          marker='''async function hydrate() {\n'''
          helper='''async function downloadArtifact(url,name){\n  if(!url)return;\n  try{\n    const response=await fetch(url,{cache:'no-store',credentials:'omit'});\n    if(!response.ok)throw new Error(`HTTP ${response.status}`);\n    const blob=await response.blob(),objectUrl=URL.createObjectURL(blob),a=document.createElement('a');\n    a.href=objectUrl;a.download=name||'REVEX-artifact';a.style.display='none';document.body.appendChild(a);a.click();a.remove();\n    setTimeout(()=>URL.revokeObjectURL(objectUrl),30000);\n  }catch(_){\n    const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();\n  }\n}\n\ndocument.addEventListener('click',(event)=>{\n  const row=event.target.closest?.('#energy-artifacts .energy-artifact[data-download-url]');\n  if(!row)return;\n  event.preventDefault();\n  void downloadArtifact(row.dataset.downloadUrl,row.dataset.downloadName);\n});\n\nasync function hydrate() {\n'''
          if s.count(marker)!=1: raise SystemExit('energy hydrate marker mismatch')
          p.write_text(s.replace(marker,helper),encoding='utf-8')

          # Cache-bust the Energy module so phones/WebView receive tap-download behavior.
          p=Path('docs/liber-apps/apps/revex/index.html'); s=p.read_text(encoding='utf-8')
          old='energy-r27.js?v=20260816r89-nine-output1'; new='energy-r27.js?v=20260817r123-package-download1'
          if s.count(old)!=1: raise SystemExit(f'index energy cache marker mismatch: {s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY

          python -m py_compile \
            server/revex-energy-worker/revex_reference_envelope_projection_r118.py \
            server/revex-energy-worker/revex_energy_pipeline_guard_r118.py \
            server/revex-energy-worker/verify_reference_envelope_r118.py
          node --check docs/liber-apps/apps/revex/energy-r27.js
          (cd server/revex-energy-worker && python verify_reference_envelope_r118.py)

          rm .github/workflows/_revex-r123-apply-once.yml
          git config user.name 'REVEX Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add server/revex-energy-worker/revex_reference_envelope_projection_r118.py \
                  server/revex-energy-worker/revex_energy_pipeline_guard_r118.py \
                  server/revex-energy-worker/verify_reference_envelope_r118.py \
                  docs/liber-apps/apps/revex/energy-r27.js \
                  docs/liber-apps/apps/revex/index.html \
                  .github/workflows/_revex-r123-apply-once.yml
          git commit -m 'REVEX r123: guarantee one-roof recovery package and tap downloads'
          git push origin HEAD:agent/revex-r123-package-guarantee
