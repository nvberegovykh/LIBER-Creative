name: REVEX r41 staging verify

on:
  push:
    branches: [revex-r41-source-sync-20260812]
    paths: ['.github/workflows/revex-r41-verify.yml']

permissions:
  contents: read

github:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download canonical r41 Companion source from Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/revex-r41
          fetch_drive() {
            local id="$1" out="$2" sha="$3"
            curl -L --fail --retry 4 --retry-delay 2 \
              "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t" \
              -o "/tmp/revex-r41/${out}"
            echo "${sha}  /tmp/revex-r41/${out}" | sha256sum -c -
          }
          fetch_drive '1ZoNuM2FzbzCcsq2e24IIvdrjEVeaIwGj' 'README.txt' 'dbaa1c3d08bd1f8e83215ead31d4bba9e64b37ea0c8f1349d5db5260063d42bf'
          fetch_drive '1g58NvJ7aN3WBEupBe0gc8UIvlWPaJ54p' 'shell-integrity.js' '09074405256c4dd7e52eb3ee76fe1a49b4ec4c0488567e772603ea570594a3e6'
          fetch_drive '1KgyV2nBDLCQTzC1T8fKium5aR7ifu4vp' 'styles.css' 'dff7473320088a9be0a8d68e26f69c32a2630ac5080191c0fe40ad9923e68f07'
          fetch_drive '1ELpV95mdDzLI8XWemMNSphXAVll19fko' 'app.js' 'dd2905f0d5983b1473edd0c8ef865c695251ac311ab77831cf441120cec06b04'
          fetch_drive '1zHfAtG7ccQZaSPN1zQ-ZLyT_v29v3Lck' 'diagnostics-r29.js' '6e506657b16c2059e36e3db2987b4649b14c7a87e56a362b3566907745cf4c83'
          fetch_drive '1UR21DaYg2EGfbwXuenavLuDgjmmxIzB7' 'ui-integrity.js' '0d362d965592bc5796e8df2c7e18919ccc91985d06a0e9b5ea5622b477842284'
          fetch_drive '10MXqTaH_3ETuWSH8oQQVQcEplYPMM2CS' 'integrity.js' 'c7b44319c1a915600092dde1f570f8e1b83b7baedbb017fe07dce2985a5b296a'
          fetch_drive '1YHqaZXp-lcLgj2RrjkjUp7HUhmjPEYgl' 'viewer-r26.js' '35a0fda8a2e219fd8e30ed76a336a4d51333f73e9c61917c93cd60895b3076d0'
          fetch_drive '10cAgG1uDl7MAcuaUsgXEz3VdJ6AfTojd' 'store.js' '072fdeaf24ef9fec6ebbf912cc23528d73bba9be15da671615859f94484396ef'
          fetch_drive '1kvRhwCEPWzUyc-0kK8Q0t2KemyJtX4p0' 'index.html' '42fd0370522d7db7edd6bb6a0ccd1f0d61c52b6ac57402febcac305c5aef29b3'
          fetch_drive '1lCABFvA380DYNyqK5W7vuAKMDTYJifdE' 'energy-r27.js' 'f2a938adafd5f0b58edfb87bf66777696a2670a62facab0331bf687188328d58'
          fetch_drive '1v52VjG7kJz-WzQI38iCevHzsKR14hp7B' 'manifest.webmanifest' '456477c0adfc9c8df81a80065f6ad2b68f56ed7de1d7c30b181be107a36a6e9c'
          fetch_drive '1n8F0yAs0LcItGUO9DmUDs2VBTznQRisb' 'energy-r27.css' 'b3ed3cf21c39c8cee56e98dfd1845d8141a45b13a30b7ce9d70cfbf28ae532dc'
          fetch_drive '116uH9xmbrQ-2NQGab1XlYozxjSeX01I9' 'viewer-host-guard-r21.js' '34416f4a0deca5b503906f847d6d15e41edb28e4f70f6a1b825735fe1ac3389b'

      - name: Static source verification
        shell: bash
        run: |
          set -euo pipefail
          for f in app.js diagnostics-r29.js ui-integrity.js integrity.js viewer-r26.js store.js energy-r27.js shell-integrity.js viewer-host-guard-r21.js; do
            cp "/tmp/revex-r41/$f" "/tmp/${f}.mjs"
            node --check "/tmp/${f}.mjs"
          done
          grep -q '20260812r41' /tmp/revex-r41/index.html
          grep -q 'id="section-left"' /tmp/revex-r41/index.html
          grep -q 'id="section-right"' /tmp/revex-r41/index.html
          grep -q 'id="section-front"' /tmp/revex-r41/index.html
          grep -q 'id="section-back"' /tmp/revex-r41/index.html
          grep -q 'id="section-bottom"' /tmp/revex-r41/index.html
          grep -q 'id="section-top"' /tmp/revex-r41/index.html
          grep -q 'storeCall' /tmp/revex-r41/app.js
          grep -q 'ENERGY_HARD_STOP = 0.80' /tmp/revex-r41/store.js
          grep -q 'ENERGY_QUALITY_TARGET = 0.95' /tmp/revex-r41/store.js
          grep -q 'syncEngineeringPackage' /tmp/revex-r41/store.js
          grep -q 'commitBimOverlay' /tmp/revex-r41/store.js
          grep -q 'RUNTIME_CONTRACT' /tmp/revex-r41/diagnostics-r29.js
          grep -q 'VIEWER_CONTRACT' /tmp/revex-r41/diagnostics-r29.js
          grep -q "BUILD='20260812r41'" /tmp/revex-r41/shell-integrity.js
          grep -q 'ENERGY_HARD_STOP = 0.80' /tmp/revex-r41/energy-r27.js
          grep -q 'ENERGY_QUALITY_TARGET = 0.95' /tmp/revex-r41/energy-r27.js

      - name: Package verified source artifact
        uses: actions/upload-artifact@v4
        with:
          name: revex-r41-canonical-companion
          path: /tmp/revex-r41
          if-no-files-found: error
          retention-days: 1
