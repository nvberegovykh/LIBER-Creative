name: REVEX current add-in updater validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'UPDATE_REVEX_ADDIN_CURRENT.ps1'
      - 'UPDATE_REVEX_ADDIN_CURRENT.cmd'
      - 'RECOVER_REVEX_ENERGY_CURRENT.ps1'
      - 'RECOVER_REVEX_ENERGY_CURRENT.cmd'
      - 'src/Liber.Revex.Revit/**'
      - '.github/scripts/verify-revex-r83-energy-single-shot.js'
      - '.github/workflows/revex-current-addin-updater-validation.yml'
  push:
    branches:
      - main
      - 'agent/revex-current-addin-updater'
      - 'agent/revex-r74-*'
      - 'agent/revex-r81-*'
      - 'agent/revex-r83-*'
      - 'agent/revex-design-ux-*'

permissions:
  contents: read

jobs:
  current-addin-updater:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Parse Windows PowerShell updater and separate Energy recovery launcher
        shell: powershell
        run: |
          foreach ($path in @('.\UPDATE_REVEX_ADDIN_CURRENT.ps1', '.\RECOVER_REVEX_ENERGY_CURRENT.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if (@($errors).Count -gt 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }
          }

      - name: Verify exact-current r126 updater source policy
        shell: powershell
        run: |
          $ps = Get-Content '.\UPDATE_REVEX_ADDIN_CURRENT.ps1' -Raw
          $cmd = Get-Content '.\UPDATE_REVEX_ADDIN_CURRENT.cmd' -Raw
          $required = @(
            'function Wait-RevitClosed',
            'Get-Process -Name "Revit"',
            'function Test-RevexPayloadUnlocked',
            '[System.IO.FileShare]::None',
            'MainWindowHandle',
            'Ignoring stale/headless Revit PID(s)',
            'REVEX DLL is unlocked',
            'This updater will wait here and continue automatically; do not rerun it.',
            'Wait-RevitClosed',
            '"--branch", "main"',
            'verify-revex-current-generation-r53.js',
            'verify-revex-r99-webview-root-cache.js',
            'verify-revex-r126-functional-convergence.js',
            'ui-integrity.js',
            'docs-convergence-r126.js',
            'appearance-convergence-r126.js',
            'issues-convergence-r126.js',
            'issues-inspector-r126.js',
            'history-daily-r126.js',
            'blocks-palette-r126.js',
            'render-convergence-r126.js',
            'RevexFamilyPlacementExternalHandler.cs',
            'AffectedPlanExportService.cs',
            'FamilyPlacementService.cs',
            'EngineeringCompanionWebBridge.cs',
            'EngineeringScheduleEvidenceService.cs',
            'RevexSpaceFailureShield.cs',
            'new EngineeringScheduleEvidenceService().Export',
            'REVIT-SCHEDULE-EVIDENCE.json',
            'ScheduleSheetInstance',
            '$InstalledRoot = Join-Path $RevexRoot "App"',
            'App.before-current.',
            'Atomic install failed; restoring the prior add-in payload.',
            'REVEX-CURRENT-SOURCE.json',
            'currentGenerationValidated = $true',
            'currentUiRootCacheValidated = $true',
            'r126FunctionalConvergenceValidated = $true',
            'staleR49CanonicalSourceUsed = $false',
            'cloudServicesChanged = $false'
          )
          foreach ($needle in $required) { if (-not $ps.Contains($needle)) { throw "Missing current updater safety marker: $needle" } }
          foreach ($forbidden in @('CanonicalSourceCommit','PUBLISH_REVEX_R49','DEPLOY_ENERGY_CURRENT','DEPLOY_ENERGY_WORKER_ONLY_R69','RECOVER_REVEX_ENERGY_CURRENT')) {
            if ($ps.Contains($forbidden)) { throw "Current updater references forbidden historical/cloud path: $forbidden" }
          }
          if ($ps.Contains('Save/close Revit completely, then rerun this updater')) { throw 'Startup Revit guard must wait instead of failing/rerun.' }
          if (-not $cmd.Contains('raw.githubusercontent.com/nvberegovykh/LIBER-Creative/main/UPDATE_REVEX_ADDIN_CURRENT.ps1')) { throw 'Launcher does not self-refresh from current main.' }
          if (-not $cmd.Contains('pause >nul')) { throw 'Launcher must remain open so success/failure can be read.' }

      - name: Preserve separate r125 Energy recovery artifact without making it current
        shell: powershell
        run: |
          $ps = Get-Content '.\RECOVER_REVEX_ENERGY_CURRENT.ps1' -Raw
          $cmd = Get-Content '.\RECOVER_REVEX_ENERGY_CURRENT.cmd' -Raw
          foreach ($needle in @(
            '$SourceCandidate = "b69071c621220cc875fff041bb2082e80e44774b"',
            'REVEX r125 Energy recovery - final filing touchups',
            'reuse byte-verified completed simulation outputs',
            'native Revit schedule totals outrank diagram re-sums',
            'actual VT wins, then approved same-envelope VT',
            'original workbook appearance is preserved',
            'whole glass-door openings, panel-by-panel multi-floor curtain-wall mapping',
            'Scope of this command: Energy worker + authenticated broker only.',
            'No Revit sync, no add-in replacement, no BIM/Docs/Render mutation.',
            'DEPLOY_ENERGY_CURRENT_ARGV_FIX.ps1',
            'specProjectId=spec_revex_mspgzb7h_729b2936bfaa',
            'future geometry refresh requires the r125 add-in/exporter and a new Engineering Sync'
          )) { if (-not $ps.Contains($needle)) { throw "separate r125 Energy recovery controller missing: $needle" } }
          if ($ps.Contains('IsPathFullyQualified')) { throw 'Recovery must remain compatible with Windows PowerShell 5.1 / .NET Framework.' }
          if (-not $cmd.Contains('raw.githubusercontent.com/nvberegovykh/LIBER-Creative/main/RECOVER_REVEX_ENERGY_CURRENT.ps1')) { throw 'Energy recovery launcher does not self-refresh from main.' }
          if (-not $cmd.Contains('PASS: REVEX r125 Energy worker and broker deployment completed.')) { throw 'Energy recovery launcher scope text is stale.' }
          if ($cmd.Contains('add-in update completed')) { throw 'Energy recovery launcher must not claim an add-in update.' }
          if (-not $cmd.Contains('pause >nul')) { throw 'Energy recovery launcher must remain open for readable success/failure.' }

      - name: Compile complete Revit 2026 add-in
        shell: pwsh
        run: |
          dotnet restore src/Liber.Revex.Revit/Liber.Revex.Revit.csproj -p:RevexCiRevitApi=true -p:Platform=x64
          dotnet build src/Liber.Revex.Revit/Liber.Revex.Revit.csproj -c Release -p:RevexCiRevitApi=true -p:Platform=x64 --no-restore

      - name: Preserve current viewer Energy and r126 contracts
        shell: pwsh
        run: |
          node .github/scripts/verify-revex-current-generation-r53.js
          node .github/scripts/verify-revex-r99-webview-root-cache.js
          node .github/scripts/verify-revex-r126-functional-convergence.js
          node .github/scripts/verify-revex-r72-nonblocking-viewer.js
          python .github/scripts/verify-revex-r69-energy-finish.py
          node .github/scripts/verify-revex-r54-selfhost-render.js
          python .github/scripts/verify-revex-r73-energy-topology-fallback.py
          node .github/scripts/verify-revex-r83-energy-single-shot.js
