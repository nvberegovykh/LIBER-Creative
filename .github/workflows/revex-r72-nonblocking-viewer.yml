name: REVEX r80 consolidated Companion validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'REVEX-DEVELOPMENT-CONTRACT.md'
      - 'docs/liber-apps/apps/revex/viewer-runtime-r75.js'
      - 'docs/liber-apps/apps/revex/appearance-state-r75.js'
      - 'docs/liber-apps/apps/revex/companion-runtime-r75.js'
      - 'docs/liber-apps/apps/revex/viewer-repair-r79.js'
      - 'docs/liber-apps/apps/revex/diagnostics-r29.js'
      - 'docs/liber-apps/apps/revex/energy-diagnostics-r68.js'
      - 'docs/liber-apps/apps/revex/ui-integrity.js'
      - 'docs/liber-apps/apps/revex/viewer-r26.js'
      - 'src/Liber.Revex.Revit/UI/RevexWebIntegrationBridge.cs'
      - 'src/Liber.Revex.Revit/Services/EngineeringCompanionWebBridge.cs'
      - 'src/Liber.Revex.Revit/Engineering/Companion/native-managed-energy-bridge.js'
      - '.github/scripts/verify-revex-r68-review-runtime.js'
      - '.github/scripts/verify-revex-r69-energy-finish.py'
      - '.github/scripts/verify-revex-r71-companion-state.js'
      - '.github/scripts/verify-revex-r72-nonblocking-viewer.js'
      - '.github/workflows/revex-r72-nonblocking-viewer.yml'
  push:
    branches:
      - main
      - 'agent/revex-r75-*'
      - 'agent/revex-r79-*'
      - 'agent/revex-r80-*'
    paths:
      - 'REVEX-DEVELOPMENT-CONTRACT.md'
      - 'docs/liber-apps/apps/revex/viewer-runtime-r75.js'
      - 'docs/liber-apps/apps/revex/appearance-state-r75.js'
      - 'docs/liber-apps/apps/revex/companion-runtime-r75.js'
      - 'docs/liber-apps/apps/revex/viewer-repair-r79.js'
      - 'docs/liber-apps/apps/revex/diagnostics-r29.js'
      - 'docs/liber-apps/apps/revex/energy-diagnostics-r68.js'
      - 'docs/liber-apps/apps/revex/ui-integrity.js'
      - 'docs/liber-apps/apps/revex/viewer-r26.js'
      - 'src/Liber.Revex.Revit/UI/RevexWebIntegrationBridge.cs'
      - 'src/Liber.Revex.Revit/Services/EngineeringCompanionWebBridge.cs'
      - 'src/Liber.Revex.Revit/Engineering/Companion/native-managed-energy-bridge.js'
      - '.github/scripts/verify-revex-r68-review-runtime.js'
      - '.github/scripts/verify-revex-r69-energy-finish.py'
      - '.github/scripts/verify-revex-r71-companion-state.js'
      - '.github/scripts/verify-revex-r72-nonblocking-viewer.js'
      - '.github/workflows/revex-r72-nonblocking-viewer.yml'

permissions:
  contents: read

jobs:
  viewer-r80:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check consolidated browser runtimes
        run: |
          node --check docs/liber-apps/apps/revex/viewer-runtime-r75.js
          node --check docs/liber-apps/apps/revex/appearance-state-r75.js
          node --check docs/liber-apps/apps/revex/companion-runtime-r75.js
          node --check docs/liber-apps/apps/revex/viewer-repair-r79.js
          node --check docs/liber-apps/apps/revex/diagnostics-r29.js
          node --check docs/liber-apps/apps/revex/energy-diagnostics-r68.js
          node --check docs/liber-apps/apps/revex/ui-integrity.js
          node --check src/Liber.Revex.Revit/Engineering/Companion/native-managed-energy-bridge.js
      - name: Verify live viewer repair interfaces
        shell: bash
        run: |
          grep -F "loadScript('viewer-repair-r79.js?v=20260816r79-viewer-repair1'" docs/liber-apps/apps/revex/ui-integrity.js
          grep -F 'v.selectAndRoute=function(row)' docs/liber-apps/apps/revex/viewer-repair-r79.js
          grep -F "root.dispatchEvent(new CustomEvent('revex:bim-selection'" docs/liber-apps/apps/revex/viewer-repair-r79.js
          grep -F 'old.cloneNode(true)' docs/liber-apps/apps/revex/viewer-repair-r79.js
          grep -F "f.setDoc(f.doc(Store.db,'projects',projectId,'revexBimOverlays',row.id)" docs/liber-apps/apps/revex/viewer-repair-r79.js
          if grep -F 'writeBatch' docs/liber-apps/apps/revex/viewer-repair-r79.js; then echo 'r79 must not depend on writeBatch'; exit 1; fi
          grep -F 'f.onAuthStateChanged(auth,user=>' docs/liber-apps/apps/revex/viewer-repair-r79.js
          grep -F 'await Store.listBimAppearances(pid)' docs/liber-apps/apps/revex/viewer-repair-r79.js
          grep -F 'if(dt>42)slow++' docs/liber-apps/apps/revex/viewer-repair-r79.js
          if grep -F 'setInterval(' docs/liber-apps/apps/revex/viewer-repair-r79.js; then echo 'r79 must remain event-driven'; exit 1; fi
      - name: Verify consolidated state ownership and filter/material contracts
        run: node .github/scripts/verify-revex-r71-companion-state.js
      - name: Verify nonblocking viewer and immutable Energy handoff
        run: node .github/scripts/verify-revex-r72-nonblocking-viewer.js
      - name: Preserve Energy identity and review contracts
        run: |
          python .github/scripts/verify-revex-r69-energy-finish.py
          node .github/scripts/verify-revex-r68-review-runtime.js
      - name: Preserve current-generation renderer and r73 Revit Energy contracts
        run: |
          node .github/scripts/verify-revex-current-generation-r53.js
          node .github/scripts/verify-revex-r54-selfhost-render.js
          if [ -f .github/scripts/verify-revex-r73-energy-topology-fallback.py ]; then python .github/scripts/verify-revex-r73-energy-topology-fallback.py; fi
      - name: Preserve architecture lessons for future agents
        run: |
          grep -F 'One concern = one runtime owner' REVEX-DEVELOPMENT-CONTRACT.md
          grep -F 'Every add-in source change must compile the real DLL in CI' REVEX-DEVELOPMENT-CONTRACT.md
          grep -F 'Immutable Energy handoff is local data, not browser networking' REVEX-DEVELOPMENT-CONTRACT.md
          grep -F 'Current-project identity is evidence normalization, not a template value' REVEX-DEVELOPMENT-CONTRACT.md
          grep -F 'Energy failures are revision-scoped' REVEX-DEVELOPMENT-CONTRACT.md
