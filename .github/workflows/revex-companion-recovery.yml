name: REVEX companion recovery
on:
  pull_request:
    paths:
      - 'docs/liber-apps/**'
      - 'tests/revex-recovery/**'
      - 'tests/revex-audit-20260928/**'
      - 'server/revex-assistant-functions/**'
      - 'server/revex-energy-functions/**'
      - 'server/revex-report-functions/**'
      - '.github/scripts/hosting-preservation.ps1'
      - '.github/scripts/test-hosting-preservation.ps1'
      - '.github/workflows/revex-companion-recovery.yml'
  push:
    branches: [main]
    paths:
      - 'docs/liber-apps/**'
      - 'tests/revex-recovery/**'
      - 'tests/revex-audit-20260928/**'
      - 'server/revex-assistant-functions/**'
      - 'server/revex-energy-functions/**'
      - 'server/revex-report-functions/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/revex-recovery/test-render-auth.cjs
      - run: node tests/revex-recovery/test-family-handoff.cjs
      - run: node tests/revex-recovery/test-walk-levels.cjs
      - run: node --test server/revex-report-functions/publication-source.test.js server/revex-energy-functions/job-ownership.test.js server/revex-assistant-functions/purchase-links.test.js
      - run: node .github/scripts/verify-revex-security-boundaries.js
      - name: Hosting preserves unrelated app assets and rejects concurrent releases
        shell: pwsh
        run: .github/scripts/test-hosting-preservation.ps1
