name: REVEX r54 self-host render + Energy + viewer validation

on:
  push:
    branches:
      - main
      - 'agent/revex-selfhost-render-energy-viewer-r54-*'
      - 'agent/revex-auto-firebase-auth-r59-*'
    paths:
      - 'docs/liber-apps/apps/revex/**'
      - 'server/revex-render-worker/**'
      - 'server/revex-render-functions/**'
      - 'server/revex-energy-worker/**'
      - 'server/firebase-functions/**'
      - 'src/Liber.Revex.Revit/Engineering/Energy/**'
      - 'src/Liber.Revex.Revit/Engineering/Gbxml/**'
      - 'DEPLOY_REVEX_CURRENT_SERVICES.ps1'
      - 'DEPLOY_REVEX_CURRENT_SERVICES_BOOTSTRAP.ps1'
      - 'DEPLOY_REVEX_CURRENT_SERVICES.cmd'
      - '.github/scripts/verify-revex-r54-selfhost-render.js'
      - '.github/scripts/verify-revex-current-generation-r53.js'
      - '.github/workflows/revex-r54-selfhost-render-energy-viewer-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/liber-apps/apps/revex/**'
      - 'server/revex-render-worker/**'
      - 'server/revex-render-functions/**'
      - 'server/revex-energy-worker/**'
      - 'server/firebase-functions/**'
      - 'src/Liber.Revex.Revit/Engineering/Energy/**'
      - 'src/Liber.Revex.Revit/Engineering/Gbxml/**'
      - 'DEPLOY_REVEX_CURRENT_SERVICES.ps1'
      - 'DEPLOY_REVEX_CURRENT_SERVICES_BOOTSTRAP.ps1'
      - 'DEPLOY_REVEX_CURRENT_SERVICES.cmd'
      - '.github/scripts/verify-revex-r54-selfhost-render.js'
      - '.github/scripts/verify-revex-current-generation-r53.js'
      - '.github/workflows/revex-r54-selfhost-render-energy-viewer-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Self-host renderer, Energy and BIM viewer contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: JavaScript syntax
        run: |
          node --check docs/liber-apps/apps/revex/render-selfhost-r54.js
          node --check docs/liber-apps/apps/revex/render-agent.js
          node --check server/revex-render-functions/index.js
          node --check .github/scripts/verify-revex-r54-selfhost-render.js
      - name: Python worker syntax
        run: python -m py_compile server/revex-render-worker/app.py server/revex-energy-worker/app.py
      - name: Parse render manifests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path('server/revex-render-worker/model-manifest.json').read_text())
          json.loads(Path('server/revex-render-functions/package.json').read_text())
          json.loads(Path('server/revex-render-functions/firebase.json').read_text())
          print('render JSON manifests: PASS')
          PY
      - name: Reject renderer, Energy or viewer regressions
        run: node .github/scripts/verify-revex-r54-selfhost-render.js
      - name: Preserve current-generation guard
        run: node .github/scripts/verify-revex-current-generation-r53.js
      - name: Inspect managed deployment scripts
        shell: pwsh
        run: |
          $render = Get-Content -Raw server/revex-render-worker/DEPLOY_RENDER_SERVER.ps1
          foreach ($required in @('--gpu-type=nvidia-rtx-pro-6000','--cpu=20','--memory=80Gi','--no-allow-unauthenticated','--concurrency=1','--min-instances=0','roles/run.invoker')) {
            if (-not $render.Contains($required)) { throw "Missing render deployment contract: $required" }
          }
          [void][scriptblock]::Create($render)

          $energy = Get-Content -Raw server/revex-energy-worker/DEPLOY_ENERGY_CURRENT.ps1
          foreach ($required in @('REVEX_SOURCE_CANDIDATE=$SourceCandidate','verify-revex-current-generation-r53.js','--no-allow-unauthenticated','roles/run.invoker')) {
            if (-not $energy.Contains($required)) { throw "Missing current Energy deployment contract: $required" }
          }
          if ($energy.Contains('CanonicalSourceCommit') -or $energy.Contains('REVEX_R49_SOURCE_')) { throw 'Current Energy deploy contains stale publisher source-restoration markers.' }
          [void][scriptblock]::Create($energy)

          $launcher = Get-Content -Raw DEPLOY_REVEX_CURRENT_SERVICES.ps1
          foreach ($required in @('DEPLOY_REVEX_CURRENT_SERVICES_BOOTSTRAP.ps1','Start-Transcript','firebase login --reauth')) {
            if (-not $launcher.Contains($required)) { throw "Missing unified launcher contract: $required" }
          }
          if ($launcher.Contains('PUBLISH_REVEX_R49.ps1')) { throw 'Unified launcher invokes stale publisher.' }
          [void][scriptblock]::Create($launcher)

          $bootstrap = Get-Content -Raw DEPLOY_REVEX_CURRENT_SERVICES_BOOTSTRAP.ps1
          foreach ($required in @('"clone", "--depth", "1", "--branch", "main"','"rev-parse", "HEAD"','DEPLOY_ENERGY_CURRENT.ps1','DEPLOY_RENDER_SERVER.ps1')) {
            if (-not $bootstrap.Contains($required)) { throw "Missing unified bootstrap contract: $required" }
          }
          if ($bootstrap.Contains('PUBLISH_REVEX_R49.ps1')) { throw 'Unified bootstrap invokes stale publisher.' }
          [void][scriptblock]::Create($bootstrap)
          Write-Host 'Managed deployment scripts: PASS'
