name: REVEX r127 switch Energy deployer
on:
  push:
    branches: [revex-energy-r127-single-controller]
    paths:
      - 'tools/update_r127_finalizer.py'
      - '.github/workflows/revex-r127-switch-energy-deployer.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revex-energy-r127-single-controller
          fetch-depth: 0
      - run: python tools/update_r127_finalizer.py
      - run: |
          grep -q 'DEPLOY_ENERGY_R127.ps1' FINALIZE_REVEX.ps1
          ! grep -q 'DEPLOY_ENERGY_CURRENT_ARGV_FIX.ps1' FINALIZE_REVEX.ps1
      - run: |
          if git diff --quiet -- FINALIZE_REVEX.ps1; then exit 0; fi
          git config user.name 'revex-release-bot'
          git config user.email 'revex-release-bot@users.noreply.github.com'
          git add FINALIZE_REVEX.ps1
          git commit -m 'REVEX r127: use clean Energy deployer'
          git push origin HEAD:revex-energy-r127-single-controller
