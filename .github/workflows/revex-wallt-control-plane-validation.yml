name: REVEX WALLT helper + fixer control plane

on:
  pull_request:
    paths:
      - 'docs/liber-apps/apps/revex/wallt-control-plane.js'
      - 'docs/liber-apps/apps/revex/wallt-cycle-history.js'
      - 'docs/liber-apps/apps/revex/wallt-fixer-adapters-r137.js'
      - 'docs/liber-apps/apps/revex/chat-convergence-r136.js'
      - 'docs/liber-apps/apps/revex/ui-integrity.js'
      - 'docs/liber-apps/apps/revex/store.js'
      - 'docs/liber-apps/apps/revex/app.js'
      - 'docs/liber-apps/apps/revex/docs-pages-r115.js'
      - 'docs/liber-apps/apps/revex/docs-convergence-r126.js'
      - 'docs/liber-apps/apps/revex/sync-docs-r24.js'
      - 'docs/liber-apps/apps/revex/blocks-palette-r126.js'
      - 'docs/liber-apps/js/wallt-agent.js'
      - 'docs/liber-apps/js/firebase-service.js'
      - 'src/Liber.Revex.Revit/UI/RevexWebIntegrationBridge.cs'
      - 'src/Liber.Revex.Revit/UI/RendairWindowManager.cs'
      - 'src/Liber.Revex.Revit/Services/FamilyPlacementService.cs'
      - 'server/firebase-functions/main.js'
      - 'server/firebase-functions/index.js'
      - 'server/firebase-functions/project-chat.js'
      - 'server/firebase-functions/project-access.js'
      - 'server/firebase-functions/package.json'
      - '.github/scripts/verify-revex-wallt-control-plane.js'
      - '.github/scripts/verify-revex-current-platform-connections.js'
      - '.github/scripts/verify-revex-r134-docs-linked-pages.js'
      - '.github/scripts/verify-revex-r135-blocks-placement.js'
      - '.github/scripts/verify-revex-r136-project-chat.js'
      - '.github/scripts/verify-revex-r137-wallt-fixer-adapters.js'
      - '.github/workflows/revex-wallt-control-plane-validation.yml'
  workflow_dispatch:

jobs:
  wallt-control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check docs/liber-apps/apps/revex/wallt-control-plane.js
          node --check docs/liber-apps/apps/revex/wallt-cycle-history.js
          node --check docs/liber-apps/apps/revex/wallt-fixer-adapters-r137.js
          node --check docs/liber-apps/apps/revex/chat-convergence-r136.js
          node --check docs/liber-apps/apps/revex/ui-integrity.js
          node --check docs/liber-apps/apps/revex/docs-pages-r115.js
          node --check docs/liber-apps/apps/revex/blocks-palette-r126.js
          node --check server/firebase-functions/main.js
          node --check server/firebase-functions/project-chat.js
          node --check .github/scripts/verify-revex-wallt-control-plane.js
          node --check .github/scripts/verify-revex-current-platform-connections.js
          node --check .github/scripts/verify-revex-r134-docs-linked-pages.js
          node --check .github/scripts/verify-revex-r135-blocks-placement.js
          node --check .github/scripts/verify-revex-r136-project-chat.js
          node --check .github/scripts/verify-revex-r137-wallt-fixer-adapters.js
      - name: Verify isolated Helper and bounded Fixer channels
        run: |
          node .github/scripts/verify-revex-wallt-control-plane.js
          node .github/scripts/verify-revex-r137-wallt-fixer-adapters.js
      - name: Verify current Docs Families and Chat boundaries
        run: |
          node .github/scripts/verify-revex-current-platform-connections.js
          node .github/scripts/verify-revex-r134-docs-linked-pages.js
          node .github/scripts/verify-revex-r135-blocks-placement.js
          node .github/scripts/verify-revex-r136-project-chat.js