name: Apply WALLT review model manifest patch

on:
  push:
    branches:
      - agent/revex-energy-maintainer-20260818
    paths:
      - .github/workflows/apply-wallt-review-model-manifest.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/revex-energy-maintainer-20260818
          fetch-depth: 0
      - name: Bind review models to actual published artifact rows
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server/revex-energy-worker/revex_energy_pipeline_current.py')
          text=p.read_text(encoding='utf-8')
          old='''def _review_models(output_root: Path) -> list[dict]:\n    rows = []\n    for name, role in (("GEOMETRY.osm", "current-geometry"), ("BASELINE.osm", "baseline"), ("PROPOSED.osm", "proposed")):\n        path = output_root / name\n        if not path.is_file():\n            continue\n        rows.append({\n            "name": name,\n            "role": role,\n            "path": name,\n            "viewer": "osm-3d",\n            "rotatable": True,\n            "bytes": path.stat().st_size,\n            "sha256": _sha256(path),\n        })\n    return rows\n'''
          new='''def _review_models(output_root: Path, artifact_rows: list[dict] | None = None) -> list[dict]:\n    rows = []\n    artifacts = [dict(row) for row in list(artifact_rows or [])]\n    for name, role in (("GEOMETRY.osm", "current-geometry"), ("BASELINE.osm", "baseline"), ("PROPOSED.osm", "proposed")):\n        path = output_root / name\n        if path.is_file():\n            rows.append({\n                "name": name, "role": role, "path": name, "viewer": "osm-3d",\n                "rotatable": True, "bytes": path.stat().st_size, "sha256": _sha256(path),\n            })\n            continue\n        # Full-pipeline review names are archive aliases over the real declared artifact path.\n        # Expose the real path/hash so Companion can fetch and rotate the OSM directly without\n        # manufacturing a second copy or depending on the ZIP container.\n        row = next((item for item in artifacts\n                    if str(item.get("reviewName") or "") == name\n                    or str(item.get("name") or "") == name), None)\n        if row is None:\n            continue\n        rows.append({\n            "name": name, "role": role, "path": row.get("path"), "viewer": "osm-3d",\n            "rotatable": True, "bytes": row.get("bytes"), "sha256": row.get("sha256"),\n            "artifactName": row.get("name"),\n        })\n    return rows\n'''
          if new in text:
              print('review-model manifest patch already present')
              raise SystemExit(0)
          if old not in text:
              raise SystemExit('Could not locate _review_models block')
          text=text.replace(old,new,1)
          text=text.replace('review_models = _review_models(output_root)','review_models = _review_models(output_root, result.get("artifacts") or [])',1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- server/revex-energy-worker/revex_energy_pipeline_current.py; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/revex-energy-worker/revex_energy_pipeline_current.py
          git commit -m "Bind WALLT OSM review models to published artifacts"
          git push origin HEAD:agent/revex-energy-maintainer-20260818
