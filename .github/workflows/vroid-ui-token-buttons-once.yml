name: VRoid UI token buttons one-shot

on:
  push:
    branches: [vroid-accessory-cloud-converter]
    paths: ['.github/workflows/vroid-ui-token-buttons-once.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore simple access UI and add token actions
        shell: bash
        run: |
          set -euo pipefail
          path='tools/vroid-accessory-cloud-converter/index.html'
          git show af73c374b7758ee9a72d5b7792e8c32481fc73a0:"$path" > /tmp/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/index.html')
          s=p.read_text(encoding='utf-8')
          old='''<section class="card"><h2>1 · Access</h2><div class="field"><label>Fine-grained GitHub token</label><input id="token" type="password" autocomplete="off" placeholder="github_pat_…" /></div><p class="small">For the test build, create a fine-grained token restricted to <b>nvberegovykh/archive</b> with only <b>Contents: Read and write</b>. It stays in this browser tab only: this page uses no cookies, localStorage, or token persistence.</p></section>'''
          new='''<section class="card"><h2>1 · Access</h2><div class="field"><label>Fine-grained GitHub token</label><input id="token" type="password" autocomplete="off" placeholder="github_pat_…" /></div><p class="small">For the test build, create a fine-grained token restricted to <b>nvberegovykh/archive</b> with only <b>Contents: Read and write</b>. It stays in this browser tab only: this page uses no cookies, localStorage, or token persistence.</p><div class="actions"><button id="openTokens" class="secondary">Open GitHub tokens</button><button id="submitToken">Submit token</button></div></section>'''
          if old not in s:
              raise SystemExit('Access-card anchor not found in known-good UI')
          s=s.replace(old,new,1)
          anchor="$('test').onclick=()=>health().catch(()=>{});"
          insert="""$('openTokens').onclick=()=>window.open('https://github.com/settings/personal-access-tokens','_blank','noopener,noreferrer');
$('submitToken').onclick=async()=>{try{await health();setStatus('GitHub token accepted. Private worker is reachable.','good')}catch(e){setStatus(e.message,'bad')}};
$('token').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('submitToken').click()}});
$('test').onclick=()=>health().catch(()=>{});"""
          if anchor not in s:
              raise SystemExit('JS anchor not found in known-good UI')
          s=s.replace(anchor,insert,1)
          Path('tools/vroid-accessory-cloud-converter/index.html').write_text(s,encoding='utf-8')
          PY
          grep -q 'id="openTokens"' "$path"
          grep -q 'id="submitToken"' "$path"
          grep -q 'https://github.com/settings/personal-access-tokens' "$path"
          rm -f .github/workflows/vroid-ui-token-buttons-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore simple VRoid token field and add open/submit buttons'
          git push origin HEAD
