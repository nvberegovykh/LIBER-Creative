name: REVEX r122 one-shot root cache bump

on:
  push:
    branches: [agent/revex-r122-root-cache]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/revex-r122-root-cache
          fetch-depth: 0
      - name: Bump r122 root loader and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/liber-apps/apps/revex/index.html')
          s=p.read_text(encoding='utf-8')
          old='ui-integrity.js?v=20260816r99-root-cache1'
          new='ui-integrity.js?v=20260817r122-mobile-final1'
          if old not in s and new not in s:
              raise SystemExit('expected ui-integrity cache key not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          rm .github/workflows/_revex-r122-cache-bump-once.yml
          git config user.name 'REVEX release bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/liber-apps/apps/revex/index.html .github/workflows/_revex-r122-cache-bump-once.yml
          git commit -m 'REVEX r122: bust WebView root UI cache'
          git push origin HEAD:agent/revex-r122-root-cache
