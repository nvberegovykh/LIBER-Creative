name: VRoid UI token field hotfix

on:
  push:
    branches: [vroid-accessory-cloud-converter]
    paths: ['.github/workflows/vroid-ui-token-field-hotfix.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vroid-accessory-cloud-converter
          fetch-depth: 0
      - name: Make token field explicit in connection modal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/vroid-accessory-cloud-converter/index.html')
          s=p.read_text(encoding='utf-8')
          def rep(old,new,label):
              global s
              if old not in s:
                  raise SystemExit(f'missing expected fragment: {label}')
              s=s.replace(old,new,1)
          rep('LIBER · TEST BUILD 2','LIBER · TEST BUILD 3','build label')
          rep("<div class=\"step\"><strong>3 · Come back and connect</strong><div class=\"small\">The fast button reads the copied key from your clipboard, verifies the private worker, then immediately clears the visible input.</div><div class=\"actions\"><button id=\"pasteConnect\">Paste copied key & connect</button><button id=\"manualToggle\" class=\"secondary\">Paste manually</button></div><div id=\"manualBox\" class=\"manual hidden\"><label>Temporary access key</label><input id=\"manualToken\" type=\"password\" autocomplete=\"off\" placeholder=\"github_pat_…\"><div class=\"actions\"><button id=\"manualConnect\">Connect</button></div></div></div>",
              "<div class=\"step\"><strong>3 · Paste the token here</strong><div class=\"small\">The field stays visible inside this one-time connection window, is password-masked, and is cleared immediately after a successful connection.</div><div id=\"manualBox\" class=\"manual\"><label>Temporary access key</label><input id=\"manualToken\" type=\"password\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"github_pat_…\"><div class=\"actions\"><button id=\"pasteConnect\" class=\"secondary\">Paste from clipboard</button><button id=\"manualConnect\">Connect private worker</button></div><div class=\"small\" style=\"margin-top:7px\">You can also click the field and press Ctrl+V. The value is never written to cookies, localStorage, or disk.</div></div></div>",
              'connection step')
          rep("$('connect').onclick=()=>{$('manualBox').classList.add('hidden');setAuthStatus('No access key is stored by this app.');$('authDialog').showModal()};",
              "$('connect').onclick=()=>{$('manualToken').value='';$('manualBox').classList.remove('hidden');setAuthStatus('Create the key on GitHub, then paste it into the field below.');$('authDialog').showModal();setTimeout(()=>$('manualToken').focus(),50)};",
              'connect handler')
          rep("$('closeAuth').onclick=()=>$('authDialog').close();\n$('manualToggle').onclick=()=>$('manualBox').classList.toggle('hidden');\n$('manualConnect').onclick=()=>verify($('manualToken').value).catch(()=>{});\n$('pasteConnect').onclick=async()=>{try{if(!navigator.clipboard?.readText)throw new Error('Clipboard read is unavailable in this browser. Use Paste manually.');const v=await navigator.clipboard.readText();await verify(v)}catch(e){setAuthStatus(e.message,'bad');$('manualBox').classList.remove('hidden')}};",
              "$('closeAuth').onclick=()=>{$('manualToken').value='';$('authDialog').close()};\n$('authDialog').addEventListener('close',()=>{$('manualToken').value=''});\n$('manualConnect').onclick=()=>verify($('manualToken').value).catch(()=>{});\n$('manualToken').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();verify($('manualToken').value).catch(()=>{})}});\n$('pasteConnect').onclick=async()=>{try{if(!navigator.clipboard?.readText)throw new Error('Clipboard read is unavailable here. Click the field and press Ctrl+V.');const v=(await navigator.clipboard.readText()).trim();if(!v)throw new Error('Clipboard is empty.');$('manualToken').value=v;$('manualToken').focus();setAuthStatus('Token pasted. Press Connect private worker.','warn')}catch(e){setAuthStatus(e.message,'bad');$('manualToken').focus()}};",
              'paste/manual handlers')
          p.write_text(s,encoding='utf-8')
          Path('tools/vroid-accessory-cloud-converter/VERSION.txt').write_text('VRoid 2.14 Accessory Converter — TEST 3\nBuild: 2026-09-10-token-field-visible\nPublic code branch: nvberegovykh/LIBER-Creative:vroid-accessory-cloud-converter\nPrivate worker branch: nvberegovykh/archive:vroid-cloud-worker\nConnection modal: visible password-masked token field; cleared after verification; no persistence.\nNo local Unity / Blender / VPM / Python / Node installation required.\n',encoding='utf-8')
          PY
          git diff --check
          python3 - <<'PY'
          import re, pathlib
          s=pathlib.Path('tools/vroid-accessory-cloud-converter/index.html').read_text()
          assert 'id="manualToken"' in s
          assert 'class="manual hidden"' not in s
          assert 'id="manualToggle"' not in s
          assert 'Paste from clipboard' in s
          print('UI token-field assertions: PASS')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/vroid-accessory-cloud-converter/index.html tools/vroid-accessory-cloud-converter/VERSION.txt
          git commit -m 'Show token field inside VRoid connection modal'
          git push origin HEAD:vroid-accessory-cloud-converter
