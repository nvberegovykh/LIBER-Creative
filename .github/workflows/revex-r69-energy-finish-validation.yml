name: REVEX current Energy identity + BIM appearance validation

on:
  push:
    branches:
      - main
      - 'agent/revex-r70-*'
      - 'agent/revex-r87-*'
    paths:
      - 'server/revex-energy-worker/revex_energy_identity_normalizer.py'
      - 'server/revex-energy-worker/revex_energy_pipeline_r69.py'
      - 'server/revex-energy-worker/revex_energy_pipeline_guard.py'
      - 'server/revex-energy-worker/revex_energy_pipeline_current.py'
      - 'server/revex-energy-worker/Dockerfile'
      - 'server/revex-energy-worker/DEPLOY_ENERGY_WORKER_ONLY_R69.ps1'
      - 'DEPLOY_REVEX_CURRENT_SERVICES.ps1'
      - 'DEPLOY_REVEX_CURRENT_SERVICES_BOOTSTRAP.ps1'
      - 'src/Liber.Revex.Revit/Engineering/Energy/comcheck_backstop.py'
      - 'docs/liber-apps/apps/revex/appearance-r70.js'
      - 'docs/liber-apps/apps/revex/ui-integrity.js'
      - 'docs/liber-apps/apps/revex/docs-pages-r68.js'
      - '.github/scripts/verify-revex-r69-energy-finish.py'
      - '.github/workflows/revex-r69-energy-finish-validation.yml'
  pull_request:
    branches: [main]

jobs:
  r70-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check current runtimes
        shell: pwsh
        run: |
          $files = @(
            'server/revex-energy-worker/DEPLOY_ENERGY_WORKER_ONLY_R69.ps1',
            'DEPLOY_REVEX_CURRENT_SERVICES.ps1',
            'DEPLOY_REVEX_CURRENT_SERVICES_BOOTSTRAP.ps1'
          )
          foreach ($path in $files) {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)
            if (@($errors).Count) { throw "$path parser errors: $(@($errors).Message -join '; ')" }
          }
          python -m py_compile server/revex-energy-worker/revex_energy_identity_normalizer.py
          python -m py_compile server/revex-energy-worker/revex_energy_pipeline_r69.py
          python -m py_compile server/revex-energy-worker/revex_energy_pipeline_guard.py
          python -m py_compile server/revex-energy-worker/revex_energy_pipeline_current.py
          python -m py_compile src/Liber.Revex.Revit/Engineering/Energy/comcheck_backstop.py
          node --check docs/liber-apps/apps/revex/appearance-r70.js
          node --check docs/liber-apps/apps/revex/ui-integrity.js
          node --check docs/liber-apps/apps/revex/docs-pages-r68.js
      - name: Prove canonical Energy facade, preserved identity, deployment, Docs and BIM appearance contracts
        run: python .github/scripts/verify-revex-r69-energy-finish.py
      - name: Preserve historical worker-only primitive without making it current
        shell: pwsh
        run: |
          $launcher = Get-Content -Raw DEPLOY_REVEX_CURRENT_SERVICES.ps1
          $bootstrap = Get-Content -Raw DEPLOY_REVEX_CURRENT_SERVICES_BOOTSTRAP.ps1
          $worker = Get-Content -Raw server/revex-energy-worker/DEPLOY_ENERGY_WORKER_ONLY_R69.ps1
          if($worker -match 'Require-Command\s+["'']firebase["'']' -or $worker -match '\$Firebase\b' -or $worker -match 'functions:revex-energy') { throw 'preserved worker-only deployment invokes or requires firebase-tools' }
          if($worker -match 'revex-render-worker' -or $worker -match 'DEPLOY_RENDER' -or $worker -match 'runRevexRender') { throw 'preserved worker-only deployment touches renderer infrastructure' }
          foreach($marker in @('Build exact current Energy worker image','Deploy private current Energy worker','Preserve Energy broker invocation access','REVEX_NATIVE_EXITCODE_AUTHORITATIVE')) { if(-not $worker.Contains($marker)){throw "worker-only deploy missing $marker"} }
          foreach($forbidden in @('EnergyWorkerOnly','DEPLOY_ENERGY_WORKER_ONLY_R69.ps1','DEPLOY_ENERGY_CURRENT.ps1')) {
            if($launcher.Contains($forbidden)){throw "current r126 launcher revives historical Energy marker $forbidden"}
            if($bootstrap.Contains($forbidden)){throw "current r126 bootstrap revives historical Energy marker $forbidden"}
          }
          foreach($marker in @('DEPLOY_REPORT_R126.ps1','DEPLOY_RENDER_R126.ps1')) { if(-not $bootstrap.Contains($marker)){throw "current bootstrap missing $marker"} }
      - name: Preserve current REVEX contracts
        run: |
          node .github/scripts/verify-revex-current-generation-r53.js
          node .github/scripts/verify-revex-r54-selfhost-render.js
          node .github/scripts/verify-revex-r68-review-runtime.js
