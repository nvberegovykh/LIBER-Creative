name: REVEX Observer AI Gate r151

on:
  pull_request:
    paths:
      - 'AI_START_HERE.md'
      - 'docs/.well-known/liber-ai.json'
      - 'docs/ai/**'
      - 'docs/liber-apps/apps/revex/observer-agent-bridge-r151.js'
      - 'docs/liber-apps/apps/revex/ui-integrity.js'
      - 'server/firebase-functions/observer-agent-broker.js'
      - 'server/firebase-functions/main.js'
      - 'server/firebase-functions/DEPLOY_OBSERVER_AGENT_CURRENT.ps1'
      - 'server/firebase-functions/REPAIR_OBSERVER_AGENT_PUBLIC_ACCESS.ps1'
      - 'DEPLOY_REVEX_OBSERVER_AI_CURRENT.cmd'
      - 'REPAIR_REVEX_OBSERVER_AI_ACCESS_CURRENT.cmd'
      - '.github/scripts/verify-revex-observer-agent-gate-r151.js'
      - '.github/workflows/revex-observer-agent-gate-r151.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-observer-agent-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check broker
        run: node --check server/firebase-functions/observer-agent-broker.js
      - name: Syntax check browser relay
        run: node --check docs/liber-apps/apps/revex/observer-agent-bridge-r151.js
      - name: Parse Observer deployment and repair PowerShell
        shell: pwsh
        run: |
          foreach($file in @(
            'server/firebase-functions/DEPLOY_OBSERVER_AGENT_CURRENT.ps1',
            'server/firebase-functions/REPAIR_OBSERVER_AGENT_PUBLIC_ACCESS.ps1'
          )){
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
            if(@($errors).Count){ throw "$file parser errors: $(@($errors | ForEach-Object {$_.Message}) -join '; ')" }
          }
      - name: Verify Observer AI contract
        run: node .github/scripts/verify-revex-observer-agent-gate-r151.js
