name: REVEX r56 PowerShell deployment validation

on:
  push:
    branches:
      - main
      - 'agent/revex-deploy-powershell-parse-fix-r56-*'
      - 'agent/revex-auto-firebase-auth-r59-*'
      - 'agent/revex-broker-docs-r64-*'
    paths:
      - 'DEPLOY_REVEX_CURRENT_SERVICES.ps1'
      - 'DEPLOY_REVEX_CURRENT_SERVICES_BOOTSTRAP.ps1'
      - 'server/revex-report-functions/DEPLOY_REPORT_R126.ps1'
      - 'server/revex-render-worker/DEPLOY_RENDER_R126.ps1'
      - 'server/revex-render-worker/DEPLOY_RENDER_SERVER.ps1'
      - '.github/workflows/revex-r56-powershell-deploy-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'DEPLOY_REVEX_CURRENT_SERVICES.ps1'
      - 'DEPLOY_REVEX_CURRENT_SERVICES_BOOTSTRAP.ps1'
      - 'server/revex-report-functions/DEPLOY_REPORT_R126.ps1'
      - 'server/revex-render-worker/DEPLOY_RENDER_R126.ps1'
      - 'server/revex-render-worker/DEPLOY_RENDER_SERVER.ps1'
      - '.github/workflows/revex-r56-powershell-deploy-validation.yml'

jobs:
  parse-and-contract:
    name: PowerShell deployment scripts parse safely
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse current deployment scripts with Windows PowerShell
        shell: powershell
        run: |
          $files = @(
            'DEPLOY_REVEX_CURRENT_SERVICES.ps1',
            'DEPLOY_REVEX_CURRENT_SERVICES_BOOTSTRAP.ps1',
            'server/revex-report-functions/DEPLOY_REPORT_R126.ps1',
            'server/revex-render-worker/DEPLOY_RENDER_R126.ps1',
            'server/revex-render-worker/DEPLOY_RENDER_SERVER.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if (@($errors).Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              throw "PowerShell parser rejected $file"
            }
          }
      - name: Reject unsafe gcloud argv and legacy current-service scope
        shell: powershell
        run: |
          $launcher = Get-Content -Raw 'DEPLOY_REVEX_CURRENT_SERVICES.ps1'
          $bootstrap = Get-Content -Raw 'DEPLOY_REVEX_CURRENT_SERVICES_BOOTSTRAP.ps1'

          foreach ($pair in @(
            @{ Name='launcher'; Text=$launcher },
            @{ Name='bootstrap'; Text=$bootstrap }
          )) {
            if ($pair.Text -match '(?m)&\s+\$GCloud\s+auth\s+list\b') {
              throw "$($pair.Name) contains direct gcloud auth-list syntax instead of argv splatting."
            }
            $hasProjection = $pair.Text.Contains('"--format", "value(account)"') -or
                             $pair.Text.Contains('"--format","value(account)"') -or
                             $pair.Text.Contains('"--format=value(account)"')
            if (-not $hasProjection) { throw "$($pair.Name) is missing an explicit account projection." }
          }

          foreach ($file in @(
            'server/revex-report-functions/DEPLOY_REPORT_R126.ps1',
            'server/revex-render-worker/DEPLOY_RENDER_R126.ps1',
            'server/revex-render-worker/DEPLOY_RENDER_SERVER.ps1'
          )) {
            $text = Get-Content -Raw $file
            if ($text -match '(?m)&\s+\$GCloud\s+auth\s+list\b' -or
                $text -match '(?m)&\s+\$GCloud\s+builds\s+get-default-service-account\b' -or
                $text -match '(?m)&\s+\$GCloud\s+run\s+services\s+describe\b') {
              throw "$file contains direct gcloud invocation syntax that lets Windows PowerShell reinterpret native arguments."
            }
          }

          foreach ($required in @('DEPLOY_REPORT_R126.ps1','DEPLOY_RENDER_R126.ps1')) {
            if (-not $bootstrap.Contains($required)) { throw "Current bootstrap missing $required" }
          }
          foreach ($forbidden in @('DEPLOY_ENERGY_CURRENT.ps1','DEPLOY_ENERGY_WORKER_ONLY_R69.ps1','EnergyWorkerOnly')) {
            if ($launcher.Contains($forbidden) -or $bootstrap.Contains($forbidden)) { throw "Current r126 deployment revives historical Energy path $forbidden" }
          }
