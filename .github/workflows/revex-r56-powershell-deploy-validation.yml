name: REVEX r56 PowerShell deployment validation

on:
  push:
    branches:
      - main
      - 'agent/revex-deploy-powershell-parse-fix-r56-*'
      - 'agent/revex-auto-firebase-auth-r59-*'
      - 'agent/revex-broker-docs-r64-*'
    paths:
      - 'DEPLOY_REVEX_CURRENT_SERVICES.ps1'
      - 'DEPLOY_REVEX_CURRENT_SERVICES_BOOTSTRAP.ps1'
      - 'server/revex-energy-worker/DEPLOY_ENERGY_CURRENT.ps1'
      - 'server/revex-render-worker/DEPLOY_RENDER_SERVER.ps1'
      - '.github/workflows/revex-r56-powershell-deploy-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'DEPLOY_REVEX_CURRENT_SERVICES.ps1'
      - 'DEPLOY_REVEX_CURRENT_SERVICES_BOOTSTRAP.ps1'
      - 'server/revex-energy-worker/DEPLOY_ENERGY_CURRENT.ps1'
      - 'server/revex-render-worker/DEPLOY_RENDER_SERVER.ps1'
      - '.github/workflows/revex-r56-powershell-deploy-validation.yml'

jobs:
  parse-and-contract:
    name: PowerShell deployment scripts parse safely
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse deployment scripts with Windows PowerShell
        shell: powershell
        run: |
          $files = @(
            'DEPLOY_REVEX_CURRENT_SERVICES.ps1',
            'DEPLOY_REVEX_CURRENT_SERVICES_BOOTSTRAP.ps1',
            'server/revex-energy-worker/DEPLOY_ENERGY_CURRENT.ps1',
            'server/revex-render-worker/DEPLOY_RENDER_SERVER.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if (@($errors).Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              throw "PowerShell parser rejected $file"
            }
          }
      - name: Reject unsafe gcloud value projections
        shell: powershell
        run: |
          $launcher = Get-Content -Raw 'DEPLOY_REVEX_CURRENT_SERVICES.ps1'
          if ($launcher -match '(?m)&\s+\$GCloud\s+auth\s+list\b') {
            throw 'Root launcher contains direct gcloud auth-list syntax instead of safe argv splatting.'
          }
          if (-not ($launcher.Contains('"--format","value(account)"') -or $launcher.Contains('"--format", "value(account)"'))) {
            throw 'Root launcher is missing the Windows-safe split account projection.'
          }

          $bootstrap = Get-Content -Raw 'DEPLOY_REVEX_CURRENT_SERVICES_BOOTSTRAP.ps1'
          if (-not ($bootstrap.Contains('"--format", "value(account)"') -or $bootstrap.Contains('"--format","value(account)"'))) {
            throw 'Bootstrap is missing the Windows-safe split account projection.'
          }

          foreach ($file in @(
            'server/revex-energy-worker/DEPLOY_ENERGY_CURRENT.ps1',
            'server/revex-render-worker/DEPLOY_RENDER_SERVER.ps1'
          )) {
            $text = Get-Content -Raw $file
            if ($text -match '(?m)&\s+\$GCloud\s+auth\s+list\b' -or
                $text -match '(?m)&\s+\$GCloud\s+builds\s+get-default-service-account\b' -or
                $text -match '(?m)&\s+\$GCloud\s+run\s+services\s+describe\b') {
              throw "$file contains direct gcloud invocation syntax that lets PowerShell reinterpret native arguments."
            }
            $splitProjection = $text.Contains('"--format","value(account)"') -or $text.Contains('"--format", "value(account)"')
            $legacyProjection = $text.Contains('--format=value(account)')
            if (-not ($splitProjection -or $legacyProjection)) {
              throw "$file is missing an explicit account projection."
            }
          }
