name: REVEX r101 structured Revit schedule evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/Liber.Revex.Revit/Services/EngineeringScheduleEvidenceService.cs'
      - 'src/Liber.Revex.Revit/Revit/RevitRequestHandler.cs'
      - 'src/Liber.Revex.Revit/Services/EngineeringSyncService.cs'
      - 'src/Liber.Revex.Revit/Services/EngineeringCompanionWebBridge.cs'
      - 'docs/liber-apps/apps/revex/store.js'
      - 'server/revex-energy-worker/app.py'
      - 'server/revex-energy-worker/revex_structured_schedule_facts.py'
      - 'server/revex-energy-worker/revex_structured_schedule_projection.py'
      - 'server/revex-energy-worker/revex_comcheck_evidence.py'
      - 'server/revex-energy-worker/revex_energy_pipeline_guard.py'
      - 'server/revex-energy-worker/verify_structured_schedule_evidence_r101.py'
      - 'server/revex-energy-worker/Dockerfile'
      - '.github/workflows/revex-r101-structured-schedule-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structured-schedule-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        run: |
          python -m py_compile \
            server/revex-energy-worker/revex_structured_schedule_facts.py \
            server/revex-energy-worker/revex_structured_schedule_projection.py \
            server/revex-energy-worker/revex_comcheck_evidence.py \
            server/revex-energy-worker/revex_energy_pipeline_guard.py \
            server/revex-energy-worker/verify_structured_schedule_evidence_r101.py
      - name: Structured current-Revit schedule fact graph regression
        env:
          PYTHONPATH: server/revex-energy-worker
        run: python server/revex-energy-worker/verify_structured_schedule_evidence_r101.py
      - name: Preserve r100 fallback regression
        env:
          PYTHONPATH: server/revex-energy-worker
        run: python server/revex-energy-worker/verify_comcheck_evidence_r100.py
      - name: Wiring, transport, commit gate and no-project-hardcode contract
        run: |
          python - <<'PY'
          from pathlib import Path
          service=Path('src/Liber.Revex.Revit/Services/EngineeringScheduleEvidenceService.cs').read_text(encoding='utf-8')
          handler=Path('src/Liber.Revex.Revit/Revit/RevitRequestHandler.cs').read_text(encoding='utf-8')
          commit=Path('src/Liber.Revex.Revit/Services/EngineeringSyncService.cs').read_text(encoding='utf-8')
          native_bridge=Path('src/Liber.Revex.Revit/Services/EngineeringCompanionWebBridge.cs').read_text(encoding='utf-8')
          store=Path('docs/liber-apps/apps/revex/store.js').read_text(encoding='utf-8')
          worker=Path('server/revex-energy-worker/app.py').read_text(encoding='utf-8')
          facts=Path('server/revex-energy-worker/revex_structured_schedule_facts.py').read_text(encoding='utf-8')
          projection=Path('server/revex-energy-worker/revex_structured_schedule_projection.py').read_text(encoding='utf-8')
          guard=Path('server/revex-energy-worker/revex_energy_pipeline_guard.py').read_text(encoding='utf-8')
          docker=Path('server/revex-energy-worker/Dockerfile').read_text(encoding='utf-8')
          assert 'REVIT-SCHEDULE-EVIDENCE.json' in service
          assert 'ScheduleSheetInstance' in service and 'placedOnSheets' in service
          assert 'new EngineeringScheduleEvidenceService().Export' in handler
          assert 'Directory.GetFiles(source.RunFolder, "*.json"' in commit
          assert 'ValidateStructuredScheduleEvidence(source.RunFolder)' in commit
          assert 'liber.revex.engineering-schedule-evidence.v1' in commit
          assert 'active-revit-document-native-schedules' in commit
          assert 'capturedCount + failedCount != scheduleCount' in commit
          assert 'revit-schedule-evidence' in commit
          assert 'structuredRevitSchedules = "active-revit-document-native-schedules"' in commit
          assert '.Concat(output.EvidenceFiles' in native_bridge
          assert 'declaredArtifacts = Array.isArray(manifest.artifacts)' in store
          assert 'transferFiles = files.filter' in store and 'for (let index = 0; index < files.length; index += 1)' in store
          assert 'sourceArtifacts": [str(path) for path in local_by_name.values()]' in worker
          assert 'building (?:height|hight) above grade plane' in facts
          assert 'EXPLICIT_CURRENT_REVIT_NYCECC_TEXT' in facts
          assert 'CONFLICT' in facts and 'corroboratingCandidateCount' in facts
          assert 'revex_structured_schedule_projection' in guard
          assert 'pdfFallbackSkipped' in guard
          assert 'revex_structured_schedule_facts.py' in docker
          combined='\n'.join((service,handler,commit,facts,projection,guard)).upper()
          for forbidden in ('250 MIDWOOD','79 WINTHROP','G-002.00','G-002'):
              assert forbidden not in combined, forbidden
          print('REVEX_R103_STRUCTURED_EVIDENCE_COMMIT_GATE=PASSED')
          PY
      - name: Pinned GeometryCo and r49 implementation are untouched
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD)"
          if printf '%s\n' "$changed" | grep -E '^src/Liber\.Revex\.Revit/Engineering/Energy/revex_energy_pipeline\.py$'; then
            echo 'r103 must not modify the pinned r49 implementation.' >&2
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -E '^src/Liber\.Revex\.Revit/Engineering/Energy/GeometryCo/OpenStudio_Energy_Model_Geometry_Compiler\.py$'; then
            echo 'r103 must not modify GeometryCo core.' >&2
            exit 1
          fi

  worker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build exact worker image and run embedded Energy QA
        run: docker build --progress=plain -f server/revex-energy-worker/Dockerfile -t revex-energy-worker:r103 .
