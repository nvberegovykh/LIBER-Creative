name: Apply REVEX r49 COMcheck roof hotfix

on:
  push:
    branches:
      - agent/revex-r49-review-integrity-20260814

permissions:
  contents: write

concurrency:
  group: revex-r49-comcheck-roof-hotfix
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: agent/revex-r49-review-integrity-20260814
          fetch-depth: 0

      - name: Apply exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH=.github/patches/revex-r49-comcheck-roof-hotfix.patch
          if git apply --check "$PATCH"; then
            git apply "$PATCH"
          elif git apply --reverse --check "$PATCH"; then
            echo 'Patch is already applied.'
            exit 0
          else
            echo 'Patch neither applies nor reverses cleanly; refusing to mutate the candidate.' >&2
            exit 1
          fi
          python -m py_compile \
            src/Liber.Revex.Revit/Engineering/Energy/revex_energy_pipeline.py \
            src/Liber.Revex.Revit/Engineering/Energy/verify_revex_r49_energy.py \
            server/revex-energy-worker/app.py \
            server/revex-energy-worker/verify_revex_r49_worker.py \
            .github/scripts/verify-revex-r49-live-comcheck.py

      - name: Commit source hotfix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            src/Liber.Revex.Revit/Engineering/Energy/revex_energy_pipeline.py \
            src/Liber.Revex.Revit/Engineering/Energy/verify_revex_r49_energy.py \
            server/revex-energy-worker/app.py \
            server/revex-energy-worker/verify_revex_r49_worker.py \
            .github/scripts/verify-revex-r49-live-comcheck.py; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'REVEX Release Bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/Liber.Revex.Revit/Engineering/Energy/revex_energy_pipeline.py \
            src/Liber.Revex.Revit/Engineering/Energy/verify_revex_r49_energy.py \
            server/revex-energy-worker/app.py \
            server/revex-energy-worker/verify_revex_r49_worker.py \
            .github/scripts/verify-revex-r49-live-comcheck.py
          git commit -m 'REVEX r49: aggregate COMcheck roof geometry'
          git push origin HEAD:agent/revex-r49-review-integrity-20260814
