name: REVEX current single-source finalization

on:
  push:
    branches: [revex-energy-r127-single-controller]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: revex-current-release-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python and JavaScript syntax
        run: |
          python -m py_compile \
            src/Liber.Revex.Revit/Engineering/Energy/revex_energy_contracts.py \
            src/Liber.Revex.Revit/Engineering/Energy/revex_final_touchups.py \
            src/Liber.Revex.Revit/Engineering/Energy/revex_pipeline_runner.py \
            src/Liber.Revex.Revit/Engineering/Energy/revex_final_touchups_r125.py \
            src/Liber.Revex.Revit/Engineering/Energy/revex_pipeline_runner_r125.py \
            server/revex-energy-worker/revex_energy_pipeline_current.py \
            .github/scripts/verify-revex-r127-single-controller.py \
            .github/scripts/verify-revex-current-release.py
          node --check .github/scripts/patch-live-firestore-rules.js
          node --check .github/scripts/verify-revex-r43-rules.js
          node --check docs/liber-apps/apps/revex/mobile-safe-r128.js
          node --check docs/liber-apps/apps/revex/render-convergence-r126.js
          node --check .github/scripts/verify-revex-r128-mobile-safe.js
      - name: Current UI and runtime convergence
        run: |
          node .github/scripts/verify-revex-current-generation-r53.js
          node .github/scripts/verify-revex-r99-webview-root-cache.js
          node .github/scripts/verify-revex-r126-functional-convergence.js
          node .github/scripts/verify-revex-r128-mobile-safe.js
      - name: Canonical current release contract
        run: python .github/scripts/verify-revex-current-release.py
      - name: Preserve proven r125 Energy shadow behavior
        run: python src/Liber.Revex.Revit/Engineering/Energy/verify_revex_r125_touchups.py

  energy-production-image:
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - name: Build exact production Energy worker image
        run: |
          docker build --progress=plain \
            -f server/revex-energy-worker/Dockerfile \
            -t revex-current-energy:${{ github.sha }} \
            .
      - name: Verify canonical worker entrypoint and current pipeline inside image
        run: |
          docker run --rm \
            -e PYTHONPATH=/opt/revex/energy:/opt/revex/server \
            -e REVEX_VERTEX_PROJECT=liber-apps-cca20 \
            -e REVEX_VERTEX_LOCATION=global \
            revex-current-energy:${{ github.sha }} \
            python3 -c "import os,app_entry,revex_energy_pipeline_current as p,revex_final_touchups as t,revex_energy_contracts as c; assert app_entry.APP is not None; assert p.CURRENT_RELEASE_PACKAGE=='REVEX_ENERGY_RELEASE_PACKAGE.zip'; assert abs(t.MISSING_VT-0.45)<1e-9; assert abs(c.DEFAULT_MISSING_VT-0.45)<1e-9; assert os.environ['REVEX_VERTEX_PROJECT']=='liber-apps-cca20'; print('REVEX_CURRENT_PRODUCTION_IMAGE=PASSED')"

  windows-release:
    runs-on: windows-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Parse every canonical release controller
        shell: powershell
        run: |
          foreach($file in @(
            '.\FINALIZE_REVEX.ps1',
            '.\firebase\deploy-current-access.ps1',
            '.\server\revex-energy-worker\deploy-current.ps1',
            '.\server\revex-render-worker\deploy-current.ps1',
            '.\server\revex-report-functions\deploy-current.ps1'
          )){
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
            if(@($errors).Count){ throw "$file parser errors: $(@($errors | ForEach-Object {$_.Message}) -join '; ')" }
          }
          $cmd=Get-Content -Raw '.\FINALIZE_REVEX.cmd'
          if(-not $cmd.Contains('raw.githubusercontent.com/nvberegovykh/LIBER-Creative/main/FINALIZE_REVEX.ps1')){throw 'FINALIZE_REVEX.cmd does not self-refresh from main'}
      - name: Compile complete Revit 2026 add-in
        shell: pwsh
        run: |
          dotnet restore src/Liber.Revex.Revit/Liber.Revex.Revit.csproj -p:RevexCiRevitApi=true -p:Platform=x64
          dotnet build src/Liber.Revex.Revit/Liber.Revex.Revit.csproj -c Release -p:RevexCiRevitApi=true -p:Platform=x64 --no-restore
      - name: Re-run canonical current release contract on Windows
        shell: pwsh
        run: python .github/scripts/verify-revex-current-release.py
