name: VRoid XWear Toolchain Bootstrap

on:
  push:
    branches: [vroid-xwear-cloud]
    paths:
      - '.github/workflows/vroid-xwear-toolchain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned ufbx source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ufbx
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/ufbx/ufbx/fcc5d6ba444cfd3eb80677dba5e37e493941abe5/ufbx.c' \
            -o /tmp/ufbx/ufbx.c
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/ufbx/ufbx/fcc5d6ba444cfd3eb80677dba5e37e493941abe5/ufbx.h' \
            -o /tmp/ufbx/ufbx.h
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/ufbx/ufbx/fcc5d6ba444cfd3eb80677dba5e37e493941abe5/LICENSE' \
            -o /tmp/ufbx/LICENSE
          sha256sum /tmp/ufbx/* | tee /tmp/ufbx/SHA256SUMS.txt
          cc -O2 -std=c99 -DUFBX_REAL_IS_FLOAT -c /tmp/ufbx/ufbx.c -o /tmp/ufbx/ufbx.o
      - name: Publish pinned toolchain source
        uses: actions/upload-artifact@v4
        with:
          name: vroid-xwear-ufbx-fcc5d6b
          path: /tmp/ufbx
          retention-days: 7
          compression-level: 9
