name: REVEX viewer repair

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/revex-r21-repair.yml'
      - '.github/revex-r21-hotfix.py'
      - '.github/revex-r21-postfix.py'
      - '.github/revex-r21-pins.py'
      - '.github/revex-r22-viewer.py'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic repairs
        run: |
          python .github/revex-r21-hotfix.py
          python .github/revex-r21-postfix.py
          python .github/revex-r21-pins.py
          python .github/revex-r22-viewer.py
      - name: Syntax checks
        run: |
          cp docs/liber-apps/apps/revex/app.js /tmp/app.mjs
          cp docs/liber-apps/apps/revex/viewer-r22.js /tmp/viewer.mjs
          node --check /tmp/app.mjs
          node --check /tmp/viewer.mjs
          node --check docs/liber-apps/apps/revex/viewer-host-guard-r21.js
          node --check docs/liber-apps/apps/revex/projection-integrity.js
          node --check docs/liber-apps/apps/revex/cache-r21.js
          node --check docs/liber-apps/apps/revex/workflow-r20.js
          node --check docs/liber-apps/apps/revex/sync-docs-r20.js
      - name: Integrity assertions
        run: |
          ! grep -q 'class BimViewer' docs/liber-apps/apps/revex/app.js
          ! grep -q 'requestAnimationFrame(() => this.animate())' docs/liber-apps/apps/revex/app.js
          grep -q 'fitAnchors(anchors)' docs/liber-apps/apps/revex/viewer-r22.js
          grep -q 'axisRotations()' docs/liber-apps/apps/revex/viewer-r22.js
          grep -q 'idleFramePersistent:true' docs/liber-apps/apps/revex/viewer-r22.js
          grep -q 'updatePins()' docs/liber-apps/apps/revex/viewer-r22.js
          grep -q 'data-unique-id' docs/liber-apps/apps/revex/app.js
          grep -q 'viewer-r22.js?v=20260810r22' docs/liber-apps/apps/revex/index.html
          grep -q "const BUILD='20260810r22'" docs/liber-apps/apps/revex/shell-integrity.js
      - name: Commit
        run: |
          git config user.name 'REVEX repair bot'
          git config user.email 'revex-repair@users.noreply.github.com'
          git add docs/liber-apps/apps/revex
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'REVEX r22 deterministic BIM registration'
          git push
