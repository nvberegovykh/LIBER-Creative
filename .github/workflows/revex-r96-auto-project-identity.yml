name: REVEX r96 automatic project identity repair

on:
  push:
    branches: ['agent/revex-r96-auto-project-identity']
    paths:
      - '.github/scripts/apply-revex-r96-auto-identity.py'
      - '.github/workflows/revex-r96-auto-project-identity.yml'
      - 'server/revex-energy-worker/revex_identity_content_agent.py'
      - 'server/revex-energy-worker/verify_identity_content_agent.py'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact r96 automatic identity patch
        run: python .github/scripts/apply-revex-r96-auto-identity.py
      - name: Compile and run content-identity regression
        run: |
          python -m py_compile server/revex-energy-worker/revex_identity_content_agent.py server/revex-energy-worker/verify_identity_content_agent.py
          cd server/revex-energy-worker
          python verify_identity_content_agent.py
      - name: Verify no project-specific runtime branch or QA weakening
        run: |
          python - <<'PY'
          from pathlib import Path
          a=Path('server/revex-energy-worker/revex_identity_content_agent.py').read_text(encoding='utf-8')
          assert 'multimodal-project-evidence' in a
          assert 'MIN_AGENT_CONFIDENCE = 0.90' in a
          assert 'required_votes = 2 if available >= 2 else 1' in a
          upper=a.upper()
          assert '250 MIDWOOD' not in upper and '79 WINTHROP' not in upper
          assert 'CONSULTANT' in upper and 'PROJECT' in upper
          print('REVEX_R96_CORE_IDENTITY_CONTRACT=PASSED')
          PY
      - name: Commit core repair
        shell: bash
        run: |
          if git diff --quiet; then echo 'No patch needed'; exit 0; fi
          git config user.name 'REVEX r96 identity repair'
          git config user.email 'actions@users.noreply.github.com'
          git add server/revex-energy-worker/revex_identity_content_agent.py server/revex-energy-worker/verify_identity_content_agent.py
          git commit -m 'REVEX r96: accept two-source multimodal project identity evidence'
          git push origin HEAD:${{ github.ref_name }}
