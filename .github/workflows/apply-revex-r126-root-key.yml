name: REVEX r126 root cache key
on:
  push:
    branches: [revex-r126-functional-convergence]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revex-r126-functional-convergence
      - name: Apply exact r126 loader key
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/liber-apps/apps/revex/index.html')
          s=p.read_text(encoding='utf-8')
          old='ui-integrity.js?v=20260817r122-mobile-final1'
          new='ui-integrity.js?v=20260817r126-functional-convergence1'
          if new in s:
              print('r126 root key already present')
          else:
              if s.count(old)!=1:
                  raise SystemExit(f'expected exactly one old loader key, found {s.count(old)}')
              p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Commit only if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/liber-apps/apps/revex/index.html
          git commit -m 'REVEX r126: activate functional convergence loader'
          git push origin HEAD:revex-r126-functional-convergence
