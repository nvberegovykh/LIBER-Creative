name: REVEX r95 recovery launcher QA

on:
  push:
    branches: ['agent/revex-r95-recovery-host']
    paths:
      - 'server/revex-energy-worker/RECOVER_REVEX_ENERGY_R95.ps1'
      - '.github/workflows/revex-r95-recovery-launcher-qa.yml'

permissions:
  contents: read

jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell and verify exact deployment scope
        shell: powershell
        run: |
          $path = Resolve-Path 'server/revex-energy-worker/RECOVER_REVEX_ENERGY_R95.ps1'
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          $text = Get-Content -Raw -LiteralPath $path
          foreach ($marker in @(
            "d541e88142645d22462f11638ecd1d0c2c04d336",
            "DEPLOY_ENERGY_WORKER_ONLY_R69.ps1",
            "-SourceCandidate `$SourceCandidate",
            "REVEX_SOURCE_CANDIDATE",
            "Do NOT run SYNC ENGINEERING again"
          )) { if (-not $text.Contains($marker)) { throw "Missing recovery marker: $marker" } }
          if ($text -match 'firebase\s+deploy|revex-render|UPDATE_REVEX_ADDIN|GbxmlEngineering') { throw 'Recovery launcher escaped Energy-worker-only scope.' }
          Write-Host 'REVEX_R95_RECOVERY_LAUNCHER_QA=PASSED'
