name: Observer public route gate

on:
  push:
    branches: [main]
    paths:
      - 'docs/observer-ai.html'
      - 'docs/observer-ai-20260917.html'
      - 'docs/ai.html'
      - 'docs/ai/**'
      - 'docs/404.html'
      - 'docs/liber-ai.json'
      - 'docs/observer-ai-guide.json'
      - '.github/workflows/observer-public-route-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-route:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose custom domain and Pages origin
        shell: bash
        run: |
          set -u
          TARGET='https://liberpict.com/observer-ai-20260917.html'
          GH_PROJECT='https://nvberegovykh.github.io/LIBER-Creative/observer-ai-20260917.html'
          GH_ROOT='https://nvberegovykh.github.io/observer-ai-20260917.html'
          echo '=== DNS ==='
          echo 'liberpict.com A:'; dig +short liberpict.com A || true
          echo 'liberpict.com AAAA:'; dig +short liberpict.com AAAA || true
          echo 'liberpict.com CNAME:'; dig +short liberpict.com CNAME || true
          echo 'nvberegovykh.github.io A:'; dig +short nvberegovykh.github.io A || true
          echo
          for url in "$TARGET" "$GH_PROJECT" "$GH_ROOT" 'https://liberpict.com/'; do
            echo "=== $url ==="
            curl -L -sS --max-time 20 -D - -o /tmp/body "$url" || true
            echo 'body-head:'; head -c 260 /tmp/body 2>/dev/null | tr '\n' ' '; echo
            echo
          done
          GH_IP="$(dig +short nvberegovykh.github.io A | head -n1)"
          if [[ -n "$GH_IP" ]]; then
            echo "=== bypass DNS, force liberpict.com Host to GitHub Pages IP $GH_IP ==="
            curl -L -sS --max-time 20 --resolve "liberpict.com:443:$GH_IP" -D - -o /tmp/direct "$TARGET" || true
            echo 'body-head:'; head -c 260 /tmp/direct 2>/dev/null | tr '\n' ' '; echo
          fi

      - name: Verify exact public counter route
        shell: bash
        run: |
          set -euo pipefail
          URL='https://liberpict.com/observer-ai-20260917.html'
          TMP="$(mktemp)"
          trap 'rm -f "$TMP"' EXIT
          code="$(curl -L --silent --show-error --output "$TMP" --write-out '%{http_code}' --max-time 20 "$URL" || true)"
          echo "http=$code sha256=$(sha256sum "$TMP" | awk '{print $1}')"
          if [[ "$code" != '200' ]] || ! grep -Fq '<title>LIBER / REVEX AI Counter</title>' "$TMP" || ! grep -Fq 'Take one AI session package' "$TMP"; then
            echo 'OBSERVER_PUBLIC_ROUTE=FAILED'
            exit 1
          fi
          echo 'OBSERVER_PUBLIC_ROUTE=PASSED'

      - name: Verify public discovery documents
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error --max-time 20 'https://liberpict.com/liber-ai.json' | grep -Fq 'observer'
          curl -L --fail --silent --show-error --max-time 20 'https://liberpict.com/observer-ai-guide.json' | grep -Fq 'Observer'
          echo 'OBSERVER_DISCOVERY=PASSED'
