name: Apply REVEX Google renderer and Walk wiring

on:
  push:
    branches: [agent/revex-google-render-walk-20260815]
    paths:
      - '.github/scripts/apply-revex-google-render-walk-r51.py'
      - '.github/workflows/apply-revex-google-render-walk-r51-temp.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/revex-google-render-walk-20260815
          fetch-depth: 0
      - name: Apply product wiring
        run: python .github/scripts/apply-revex-google-render-walk-r51.py
      - name: Syntax and contract checks
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/liber-apps/apps/revex/render-agent.js
          node --check docs/liber-apps/js/firebase-loader.js
          cp docs/liber-apps/apps/revex/workspace-r51.js /tmp/workspace-r51.mjs
          node --check /tmp/workspace-r51.mjs
          grep -q 'gemini-3.1-flash-image' docs/liber-apps/apps/revex/render-agent.js
          grep -q 'x-goog-user-project' docs/liber-apps/apps/revex/render-agent.js
          grep -q 'requestPointerLock' docs/liber-apps/apps/revex/workspace-r51.js
          grep -q 'workspace-r51.js?v=20260815r49-workspace1' docs/liber-apps/apps/revex/index.html
          grep -q 'render-agent.js?v=20260815r49-google-render1' docs/liber-apps/apps/revex/index.html
          grep -q 'reauthenticateWithPopup' docs/liber-apps/js/firebase-loader.js
      - name: Commit product wiring
        run: |
          git config user.name 'Nikita Beregovykh'
          git config user.email '116811305+nvberegovykh@users.noreply.github.com'
          git add docs/liber-apps/apps/revex/index.html docs/liber-apps/js/firebase-loader.js
          git diff --cached --quiet && { echo 'No product wiring staged'; exit 1; }
          git commit -m 'REVEX: wire direct Google renderer and ACC-like Walk'
          git push origin HEAD:agent/revex-google-render-walk-20260815
