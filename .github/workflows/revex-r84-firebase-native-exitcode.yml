name: REVEX r84 Firebase native-exitcode validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/revex-energy-worker/DEPLOY_ENERGY_CURRENT.ps1'
      - '.github/workflows/revex-r84-firebase-native-exitcode.yml'
  push:
    branches:
      - main
      - 'agent/revex-r84-*'
    paths:
      - 'server/revex-energy-worker/DEPLOY_ENERGY_CURRENT.ps1'
      - '.github/workflows/revex-r84-firebase-native-exitcode.yml'

permissions:
  contents: read

jobs:
  native-exitcode:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse and execute actual native wrappers
        shell: powershell
        run: |
          $path = Resolve-Path '.\server\revex-energy-worker\DEPLOY_ENERGY_CURRENT.ps1'
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if (@($errors).Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

          foreach ($name in @('Native-Ok','Invoke-Checked')) {
            $fn = $ast.Find({ param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq $name }, $true)
            if (-not $fn) { throw "Missing function $name" }
            . ([scriptblock]::Create($fn.Extent.Text))
          }

          $text = Get-Content -Raw $path
          foreach ($marker in @(
            'REVEX_NATIVE_EXITCODE_AUTHORITATIVE',
            '$ErrorActionPreference = "Continue"',
            '$env:REVEX_FIREBASE_AUTH_VERIFIED -ne "1"',
            'Firebase administrator session accepted for managed Energy deployment.'
          )) {
            if (-not $text.Contains($marker)) { throw "Missing r84 marker: $marker" }
          }

          $ErrorActionPreference = 'Stop'
          if (-not (Native-Ok $env:ComSpec @('/d','/c','echo normal-firebase-progress 1>&2 & exit /b 0'))) {
            throw 'Native-Ok misclassified successful native stderr as failure.'
          }
          Invoke-Checked 'benign native stderr' $env:ComSpec @('/d','/c','echo normal-firebase-progress 1>&2 & exit /b 0')

          if (Native-Ok $env:ComSpec @('/d','/c','echo actual-error 1>&2 & exit /b 7')) {
            throw 'Native-Ok ignored a nonzero native exit code.'
          }
          $failed = $false
          try { Invoke-Checked 'real native failure' $env:ComSpec @('/d','/c','echo actual-error 1>&2 & exit /b 7') }
          catch { $failed = $_.Exception.Message -match 'exit code 7' }
          if (-not $failed) { throw 'Invoke-Checked did not propagate the real nonzero exit code.' }

          Write-Host 'PASS: Firebase/native progress on stderr cannot false-fail; real nonzero exit codes still fail.' -ForegroundColor Green
