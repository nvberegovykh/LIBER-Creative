name: REVEX 0.8.19 r44 validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/revex-r27-0819-engineering-release.yml'
      - '.github/scripts/**'
      - 'firebase/**'
      - 'docs/liber-apps/apps/revex/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/revex-r27-0819-engineering-release.yml'
      - '.github/scripts/**'
      - 'firebase/**'
      - 'docs/liber-apps/apps/revex/**'

permissions:
  contents: read

concurrency:
  group: revex-0819-r44-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static and contract QA
        shell: bash
        run: |
          set -euo pipefail
          APP='docs/liber-apps/apps/revex'
          for file in app.js store.js viewer-r26.js integrity.js firestore-compat.js ui-integrity.js diagnostics-r29.js energy-r27.js energy-contract-r40.js history-r24.js revex-r41-live.js shell-integrity.js; do
            cp "$APP/$file" "/tmp/${file%.js}.mjs"
            node --check "/tmp/${file%.js}.mjs"
          done
          python -m json.tool "$APP/manifest.webmanifest" >/dev/null
          node .github/scripts/verify-revex-r44-companion.js
          node .github/scripts/verify-revex-r43-firestore.js
          node .github/scripts/verify-revex-r43-rules-patcher.js

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Project-access Firestore emulator QA
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          node .github/scripts/patch-live-firestore-rules.js \
            .github/scripts/fixtures/live-firestore-base.rules \
            firebase/revex-project-access-r43.rules \
            firebase/r43-emulator/firestore.rules
          mkdir -p /tmp/revex-rules-test
          cd /tmp/revex-rules-test
          npm init -y >/dev/null
          npm install --no-audit --no-fund firebase-tools@latest @firebase/rules-unit-testing@latest firebase@latest
          cd "$GITHUB_WORKSPACE/firebase/r43-emulator"
          /tmp/revex-rules-test/node_modules/.bin/firebase emulators:exec \
            --only firestore --project demo-revex-r43 \
            "NODE_PATH=/tmp/revex-rules-test/node_modules node $GITHUB_WORKSPACE/.github/scripts/verify-revex-r43-rules.js"
