name: REVEX r27 / 0.8.19 Spec Energy release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/revex-r27-0819-engineering-release.yml'

permissions:
  contents: write

concurrency:
  group: revex-r27-0819-spec-energy-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact REVEX 0.8.19 Companion files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/revex-r27
          fetch_drive() {
            local id="$1" out="$2" sha="$3"
            curl -L --fail --retry 4 --retry-delay 2 \
              "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t" \
              -o "/tmp/revex-r27/${out}"
            echo "${sha}  /tmp/revex-r27/${out}" | sha256sum -c -
          }
          fetch_drive '1kvRhwCEPWzUyc-0kK8Q0t2KemyJtX4p0' 'index.html' 'dba1d6227d2ee863be090196e056ded0a2033c5c341c463b0bf1b915bc817612'
          fetch_drive '1ELpV95mdDzLI8XWemMNSphXAVll19fko' 'app.js' 'df4f321deefa1521483787fac64306de44d694e88c73b103f941beeefa3dba9f'
          fetch_drive '10cAgG1uDl7MAcuaUsgXEz3VdJ6AfTojd' 'store.js' '72556aa335c5a29ccc6247bcbe626da82f015502962b6c74dc357816e2b1f966'
          fetch_drive '1lCABFvA380DYNyqK5W7vuAKMDTYJifdE' 'energy-r27.js' '0580f13329a6a25a6fead118bff32a705e337a6e32de0962292ce11f17b07846'
          fetch_drive '1n8F0yAs0LcItGUO9DmUDs2VBTznQRisb' 'energy-r27.css' 'e630617006fc22daf4c4e9dd6a9009ac2186a83494bdbcf11b4ffc33238fbc86'
          fetch_drive '1g58NvJ7aN3WBEupBe0gc8UIvlWPaJ54p' 'shell-integrity.js' '34361df874e8b291bf882afd2e5ad7daf3a9a308f5007153ca46caf1deb68f1f'
          fetch_drive '1ZoNuM2FzbzCcsq2e24IIvdrjEVeaIwGj' 'README.txt' '6930658a66353bfb554c381b12014cca0574dfc567b2721638bc4a11dd39c50d'

      - name: Install r27 Spec Energy Companion files
        shell: bash
        run: |
          set -euo pipefail
          DST='docs/liber-apps/apps/revex'
          install -m 0644 /tmp/revex-r27/index.html "$DST/index.html"
          install -m 0644 /tmp/revex-r27/app.js "$DST/app.js"
          install -m 0644 /tmp/revex-r27/store.js "$DST/store.js"
          install -m 0644 /tmp/revex-r27/energy-r27.js "$DST/energy-r27.js"
          install -m 0644 /tmp/revex-r27/energy-r27.css "$DST/energy-r27.css"
          install -m 0644 /tmp/revex-r27/shell-integrity.js "$DST/shell-integrity.js"
          install -m 0644 /tmp/revex-r27/README.txt "$DST/README.txt"

      - name: Align LIBER Apps launcher to REVEX 0.8.19
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('docs/liber-apps/js/apps.js')
          s = p.read_text(encoding='utf-8')
          m = re.search(r"id:\s*'revex'", s)
          if not m:
              raise SystemExit('REVEX launcher entry not found')
          start = m.start()
          end = min(len(s), start + 1800)
          block = s[start:end]
          block, n1 = re.subn(r"version:\s*'[^']+'", "version: '0.8.19'", block, count=1)
          block, n2 = re.subn(r"lastUpdated:\s*'[^']+'", "lastUpdated: '2026-08-11'", block, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'Could not align REVEX launcher metadata: version={n1}, date={n2}')
          p.write_text(s[:start] + block + s[end:], encoding='utf-8')
          PY

      - name: Static architecture QA
        shell: bash
        run: |
          set -euo pipefail
          cp docs/liber-apps/apps/revex/app.js /tmp/revex-app.mjs
          cp docs/liber-apps/apps/revex/store.js /tmp/revex-store.mjs
          cp docs/liber-apps/apps/revex/energy-r27.js /tmp/revex-energy.mjs
          cp docs/liber-apps/apps/revex/shell-integrity.js /tmp/revex-shell.mjs
          node --check /tmp/revex-app.mjs
          node --check /tmp/revex-store.mjs
          node --check /tmp/revex-energy.mjs
          node --check /tmp/revex-shell.mjs
          grep -q 'data-view="spec">Spec</button>' docs/liber-apps/apps/revex/index.html
          grep -q 'data-spec-section="book"' docs/liber-apps/apps/revex/index.html
          grep -q 'data-spec-section="energy"' docs/liber-apps/apps/revex/index.html
          grep -q 'id="spec-energy-section"' docs/liber-apps/apps/revex/index.html
          grep -q 'id="view-docs"' docs/liber-apps/apps/revex/index.html
          ! grep -q 'data-view="engineering"' docs/liber-apps/apps/revex/index.html
          ! grep -q 'id="view-engineering"' docs/liber-apps/apps/revex/index.html
          ! grep -q 'data-view="energy"' docs/liber-apps/apps/revex/index.html
          ! grep -q 'id="view-energy"' docs/liber-apps/apps/revex/index.html
          ! grep -q 'data-energy-applicant' docs/liber-apps/apps/revex/index.html
          ! grep -q 'id="energy-seal"' docs/liber-apps/apps/revex/index.html
          grep -q 'data-liber-revex-energy-input="1"' docs/liber-apps/apps/revex/index.html
          grep -q 'syncEngineeringPackage' docs/liber-apps/apps/revex/store.js
          grep -q 'getEngineeringState' docs/liber-apps/apps/revex/store.js
          grep -q 'publishEnergyResult' docs/liber-apps/apps/revex/store.js
          grep -q 'manifest.projectId && manifest.projectId !== projectId' docs/liber-apps/apps/revex/store.js
          grep -q "applicant: {}" docs/liber-apps/apps/revex/energy-r27.js
          grep -q "sealDataUrl: ''" docs/liber-apps/apps/revex/energy-r27.js
          grep -q "VERSION='0.8.19'" docs/liber-apps/apps/revex/shell-integrity.js
          grep -q "BUILD='20260811r27'" docs/liber-apps/apps/revex/shell-integrity.js
          grep -q "version: '0.8.19'" docs/liber-apps/js/apps.js
          grep -q 'Energy is a section inside the REVEX Companion Spec tab' docs/liber-apps/apps/revex/README.txt

      - name: Commit live Spec Energy release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'REVEX release bot'
          git config user.email 'revex-release@users.noreply.github.com'
          git add docs/liber-apps/apps/revex/index.html \
                  docs/liber-apps/apps/revex/app.js \
                  docs/liber-apps/apps/revex/store.js \
                  docs/liber-apps/apps/revex/energy-r27.js \
                  docs/liber-apps/apps/revex/energy-r27.css \
                  docs/liber-apps/apps/revex/shell-integrity.js \
                  docs/liber-apps/apps/revex/README.txt \
                  docs/liber-apps/js/apps.js
          if git diff --cached --quiet; then
            echo 'REVEX r27 Spec Energy Companion already live in main'
            exit 0
          fi
          git commit -m 'REVEX 0.8.19 unified Energy sync under Spec'
          git push origin HEAD:main
