name: REVEX 0.8.19 r49 final validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/revex-r27-0819-engineering-release.yml'
      - '.github/scripts/**'
      - 'firebase/**'
      - 'docs/liber-apps/apps/revex/**'
      - 'src/Liber.Revex.Revit/**'
      - 'server/revex-energy-worker/**'
      - 'server/firebase-functions/**'
      - 'PUBLISH_REVEX_R49.*'
  push:
    branches: [main]
    paths:
      - '.github/workflows/revex-r27-0819-engineering-release.yml'
      - '.github/scripts/**'
      - 'firebase/**'
      - 'docs/liber-apps/apps/revex/**'
      - 'src/Liber.Revex.Revit/**'
      - 'server/revex-energy-worker/**'
      - 'server/firebase-functions/**'
      - 'PUBLISH_REVEX_R49.*'

permissions:
  contents: read

concurrency:
  group: revex-r49-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-gate:
    name: REVEX r49 final gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Parse production publisher
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'PUBLISH_REVEX_R49.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Recorded-Revit, syntax, project-access and broker dependency QA
        shell: bash
        run: |
          set -euo pipefail
          APP='docs/liber-apps/apps/revex'
          for file in app.js store.js viewer-r26.js integrity.js firestore-compat.js ui-integrity.js diagnostics-r29.js energy-r27.js energy-contract-r40.js history-r24.js revex-r41-live.js shell-integrity.js; do
            cp "$APP/$file" "/tmp/${file%.js}.mjs"
            node --check "/tmp/${file%.js}.mjs"
          done
          node --check server/firebase-functions/index.js
          node --check server/firebase-functions/project-access.js
          node --check .github/scripts/verify-revex-r49-live-rules.js
          node .github/scripts/verify-revex-r49.js --report /tmp/revex-r49-simulation.json
          node server/firebase-functions/verify-project-access-r49.js
          npm --prefix server/firebase-functions ci --omit=dev --no-audit --no-fund
          npm --prefix server/firebase-functions audit --omit=dev --audit-level=moderate

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Current-project Energy and worker contract QA
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            -r src/Liber.Revex.Revit/Engineering/Energy/requirements.txt \
            -r server/revex-energy-worker/requirements-server.txt
          python src/Liber.Revex.Revit/Engineering/Energy/verify_revex_r49_energy.py
          python server/revex-energy-worker/verify_revex_r49_worker.py

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Exact project-access rules behavior QA
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          RULES='firebase/r49-live-rules'
          npm --prefix "$RULES" ci --no-audit --no-fund
          npm --prefix "$RULES" audit --audit-level=high
          npm install --global firebase-tools@15.27.0 --no-audit --no-fund
          node .github/scripts/patch-live-firestore-rules.js \
            .github/scripts/fixtures/live-firestore-base.rules \
            firebase/revex-project-access-r43.rules \
            "$RULES/firestore.rules"
          cd "$RULES"
          NODE_PATH="$GITHUB_WORKSPACE/$RULES/node_modules" \
            firebase emulators:exec \
              --only firestore --project demo-revex-r49 \
              "node $GITHUB_WORKSPACE/.github/scripts/verify-revex-r49-live-rules.js"
