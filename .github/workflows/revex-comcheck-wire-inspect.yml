name: REVEX COMcheck wire inspect
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium pypdf
      - name: Live COMcheck import/export wire acceptance
        shell: python
        run: |
          import pathlib,re,tempfile,urllib.request,json
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          base='https://legacy-comcheck.energycode.pnl.gov/CheckWeb/'
          ref=pathlib.Path('src/Liber.Revex.Revit/Engineering/Energy/References/COMcheck_250_MIDWOOD_STRUCTURE_REFERENCE.cxl').resolve()
          with tempfile.TemporaryDirectory() as td:
              td=pathlib.Path(td)
              p=td/'REVEX_COMCHECK_CURRENT_QA.cxl'
              original=ref.read_text(encoding='utf-8'); text=original
              replacements={'projectTitle':'REVEX COMCHECK LIVE QA','projectAddress':'999 TEST AVENUE','projectCity':'BROOKLYN','projectState':'New York','projectZipCode':'11201'}
              originals={}
              for tag,value in replacements.items():
                  pattern=rf'(<{tag}>\s*<!\[CDATA\[)(.*?)(\]\]>\s*</{tag}>)'
                  m=re.search(pattern,text,re.S)
                  if not m: raise RuntimeError('Missing '+tag)
                  originals[tag]=m.group(2)
                  text,n=re.subn(pattern,lambda x:x.group(1)+value+x.group(3),text,count=1,flags=re.S)
                  if n!=1: raise RuntimeError('Bad replacement '+tag)
              normalized=text
              for tag,value in originals.items():
                  pattern=rf'(<{tag}>\s*<!\[CDATA\[)(.*?)(\]\]>\s*</{tag}>)'
                  normalized=re.sub(pattern,lambda x:x.group(1)+value+x.group(3),normalized,count=1,flags=re.S)
              if normalized!=original: raise RuntimeError('Byte-preserving migration changed non-identity bytes')
              p.write_text(text,encoding='utf-8',newline='')
              print('BYTE_PRESERVATION_GATE=PASSED')

              o=webdriver.ChromeOptions();o.add_argument('--headless=new');o.add_argument('--no-sandbox');o.add_argument('--disable-dev-shm-usage')
              d=webdriver.Chrome(options=o); d.set_script_timeout(45)
              try:
                  w=WebDriverWait(d,45);d.get(base+'index.html');w.until(lambda x:x.execute_script("return typeof ProjectService!=='undefined' && typeof dwr!=='undefined' && typeof USER_PROJECT!=='undefined' && USER_PROJECT!==null"))
                  print('SITE_UPLOAD_WRAPPER=',d.execute_script("return typeof window.uploadProject==='function' ? String(window.uploadProject) : 'MISSING'"))

                  exported=d.execute_async_script("""
                    const done=arguments[arguments.length-1]; let settled=false;
                    const finish=(x)=>{if(!settled){settled=true;done(JSON.stringify(x));}};
                    ProjectService.downloadProject({
                      callback:function(r){finish({ok:true,path:String(r)})},
                      exceptionHandler:function(msg,ex){let x={};try{for(const k of Object.getOwnPropertyNames(ex||{}))x[k]=(ex||{})[k]}catch(e){};finish({ok:false,error:String(msg),exception:x})},
                      errorHandler:function(msg,ex){let x={};try{for(const k of Object.getOwnPropertyNames(ex||{}))x[k]=(ex||{})[k]}catch(e){};finish({ok:false,error:String(msg),exception:x})},
                      timeout:30000
                    });
                  """)
                  export_result=json.loads(exported)
                  print('DOWNLOAD_PROJECT_RESULT=',exported)
                  if not export_result.get('ok') or not export_result.get('path'): raise RuntimeError('official clean project export failed')
                  cookies='; '.join(f"{c['name']}={c['value']}" for c in d.get_cookies());ua=d.execute_script('return navigator.userAgent')
                  export_url=urllib.request.urljoin(base,export_result['path'])
                  clean_bytes=urllib.request.urlopen(urllib.request.Request(export_url,headers={'Cookie':cookies,'User-Agent':ua,'Referer':base+'index.html'}),timeout=45).read()
                  clean=td/'COMCHECK_LIVE_CLEAN_REFERENCE.cxl';clean.write_bytes(clean_bytes)
                  clean_text=clean_bytes.decode('utf-8','replace')
                  print('CLEAN_EXPORT_BYTES=',len(clean_bytes))
                  for tag in ('projectType','bldgUseType','feetBldgHeight','numberOfStories','code','complianceMode','version','state','city'):
                      m=re.search(rf'<{tag}>(?:\s*<!\[CDATA\[)?\s*(.*?)(?:\]\]>)?\s*</{tag}>',clean_text,re.S)
                      print('CLEAN_TAG_'+tag+'=',re.sub(r'\s+',' ',m.group(1)).strip() if m else 'MISSING')
                  print('CLEAN_EXPORT_PREFIX=',clean_text[:5000].replace('\n',' | '))

                  d.execute_script("let e=document.getElementById('fileToUpload'); if(!e){e=document.createElement('input');e.type='file';e.id='fileToUpload';e.name='fileToUpload';document.body.appendChild(e);}")
                  def upload(path, label, identity=''):
                      e=d.find_element(By.ID,'fileToUpload'); e.send_keys(str(path))
                      result=d.execute_async_script("""
                        const expected=arguments[0], done=arguments[arguments.length-1];
                        const el=document.getElementById('fileToUpload'), file=dwr.util.getValue('fileToUpload'), filename=el.value;
                        let settled=false; const finish=(x)=>{if(!settled){settled=true;done(JSON.stringify(x));}};
                        ProjectService.uploadProject(filename,file,{
                          callback:function(r){try{const s=JSON.stringify(r);finish({ok:true,identityPresent:expected? s.includes(expected):true,bytes:s.length,prefix:s.slice(0,1500)})}catch(e){finish({ok:false,error:'callback '+String(e)})}},
                          exceptionHandler:function(msg,ex){let x={};try{for(const k of Object.getOwnPropertyNames(ex||{}))x[k]=(ex||{})[k]}catch(e){};finish({ok:false,error:String(msg),exception:x,exceptionText:String(ex)})},
                          errorHandler:function(msg,ex){let x={};try{for(const k of Object.getOwnPropertyNames(ex||{}))x[k]=(ex||{})[k]}catch(e){};finish({ok:false,error:String(msg),exception:x,exceptionText:String(ex)})},
                          timeout:30000
                        });
                      """, identity)
                      print(label+'=',result)
                      try:d.find_element(By.ID,'fileToUpload').clear()
                      except Exception:pass
                      return json.loads(result)

                  clean_result=upload(clean,'CLEAN_EXPORT_REIMPORT')
                  original_result=upload(ref,'ORIGINAL_REFERENCE_UPLOAD','250 Midwood Street')
                  migrated_result=upload(p,'MIGRATED_REFERENCE_UPLOAD','REVEX COMCHECK LIVE QA')
                  if not clean_result.get('ok'):
                      raise RuntimeError('COMcheck cannot re-import its own current-session export')
                  if original_result.get('ok') or migrated_result.get('ok'):
                      print('LEGACY_REFERENCE_IMPORTABLE=true')
                  else:
                      print('LEGACY_REFERENCE_IMPORTABLE=false')
                      raise RuntimeError('legacy reference requires one-time translation to clean live COMcheck schema')
              finally:d.quit()
