name: REVEX COMcheck wire inspect
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Inspect official COMcheck load/save functions
        shell: python
        run: |
          import re, urllib.request
          base='https://legacy-comcheck.energycode.pnl.gov/CheckWeb/'
          for rel in ['includes/load_save.js','includes/start_app.js','index.html']:
              req=urllib.request.Request(base+rel,headers={'User-Agent':'Mozilla/5.0 REVEX-r49-source-inspect'})
              text=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
              print('\n###',rel,'bytes',len(text))
              for needle in ['function loadProject','function uploadProject','function reloadProject','fileToUpload','Unable to load project','loadProject =','uploadProject =']:
                  for m in list(re.finditer(re.escape(needle),text,re.I))[:8]:
                      print('\n---',needle,'---')
                      print(text[max(0,m.start()-1800):min(len(text),m.start()+5000)])
