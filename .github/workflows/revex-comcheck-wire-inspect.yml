name: REVEX COMcheck wire inspect
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium
      - name: Upload untouched reference CXL through official COMcheck browser
        shell: python
        run: |
          import pathlib,time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.common.exceptions import NoAlertPresentException
          base='https://legacy-comcheck.energycode.pnl.gov/CheckWeb/'
          p=pathlib.Path('src/Liber.Revex.Revit/Engineering/Energy/References/COMcheck_250_MIDWOOD_STRUCTURE_REFERENCE.cxl').resolve()
          o=webdriver.ChromeOptions();o.add_argument('--headless=new');o.add_argument('--no-sandbox');o.add_argument('--disable-dev-shm-usage')
          d=webdriver.Chrome(options=o)
          try:
              w=WebDriverWait(d,45);d.get(base+'index.html');w.until(lambda x:x.execute_script("return typeof uploadProject==='function' && typeof USER_PROJECT!=='undefined' && USER_PROJECT!==null"))
              d.execute_script("let e=document.createElement('input');e.type='file';e.id='fileToUpload';e.name='fileToUpload';document.body.appendChild(e);")
              d.find_element(By.ID,'fileToUpload').send_keys(str(p));d.execute_script('uploadProject();')
              deadline=time.time()+45
              while time.time()<deadline:
                  try:
                      a=d.switch_to.alert;txt=a.text;print('UNTOUCHED_REFERENCE_ALERT=',txt);a.accept();raise RuntimeError('reference rejected: '+txt)
                  except NoAlertPresentException:pass
                  title=d.execute_script("try{return USER_PROJECT.project.projectDetails.title.value}catch(e){return ''}")
                  if title and title!='Project title':print('UNTOUCHED_REFERENCE_UPLOAD=PASSED title=',title);break
                  time.sleep(.25)
              else:raise RuntimeError('reference upload timeout')
          finally:d.quit()
