name: REVEX COMcheck wire inspect
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Trace official COMcheck application-session initialization
        shell: python
        run: |
          import html, re, urllib.parse, urllib.request
          base='https://legacy-comcheck.energycode.pnl.gov/CheckWeb/'
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor())
          def get(rel):
              req=urllib.request.Request(urllib.parse.urljoin(base,rel),headers={'User-Agent':'Mozilla/5.0 REVEX-r49-live-session-inspection'})
              return opener.open(req,timeout=30).read().decode('utf-8','replace')
          for rel in ['dwr/test/ProjectService','dwr/interface/ProjectService.js']:
              try:
                  text=get(rel)
                  print('\n===',rel,'===')
                  for needle in ['uploadProject','getCurrentProjectName','saveNewProject','InvalidSessionException']:
                      for m in list(re.finditer(needle,text,re.I))[:8]:
                          print(re.sub(r'\s+',' ',html.unescape(text[max(0,m.start()-900):m.start()+1800])))
              except Exception as e:
                  print(rel,'ERROR',repr(e))
          index=get('index.html')
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)',index,re.I)
          print('SCRIPT_SRCS=',srcs)
          targets=[]
          for src in srcs:
              try:
                  text=get(src)
              except Exception as e:
                  continue
              if re.search(r'ProjectService|uploadProject|getCurrentProjectName|saveNewProject',text,re.I):
                  targets.append(src)
                  print('\n=== SCRIPT',src,'===')
                  for needle in ['uploadProject','getCurrentProjectName','saveNewProject','ProjectService.','initialize','newProject']:
                      for m in list(re.finditer(re.escape(needle),text,re.I))[:12]:
                          print('---',needle,'---')
                          print(re.sub(r'\s+',' ',text[max(0,m.start()-1200):m.start()+2200]))
          print('MATCHING_SCRIPTS=',targets)
