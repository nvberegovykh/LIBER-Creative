name: REVEX COMcheck wire inspect
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Install browser automation client
        run: python -m pip install --disable-pip-version-check selenium
      - name: Live official COMcheck browser upload calculation and PDF
        shell: python
        run: |
          import pathlib, tempfile, urllib.request, xml.etree.ElementTree as ET
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          base='https://legacy-comcheck.energycode.pnl.gov/CheckWeb/'
          reference=pathlib.Path('src/Liber.Revex.Revit/Engineering/Energy/References/COMcheck_250_MIDWOOD_STRUCTURE_REFERENCE.cxl')
          with tempfile.TemporaryDirectory() as td:
              folder=pathlib.Path(td)
              test=folder/'REVEX_COMCHECK_BROWSER_QA.cxl'
              tree=ET.parse(reference); root=tree.getroot()
              values={'projectTitle':'REVEX COMCHECK LIVE QA','projectAddress':'999 TEST AVENUE','projectCity':'BROOKLYN','projectState':'New York','projectZipCode':'11201'}
              for node in root.iter():
                  local=node.tag.rsplit('}',1)[-1]
                  if local in values: node.text=values[local]
              tree.write(test,encoding='utf-8',xml_declaration=True)

              options=webdriver.ChromeOptions()
              options.add_argument('--headless=new')
              options.add_argument('--no-sandbox')
              options.add_argument('--disable-dev-shm-usage')
              options.add_argument('--window-size=1400,1000')
              driver=webdriver.Chrome(options=options)
              try:
                  wait=WebDriverWait(driver,45)
                  driver.get(base+'index.html')
                  wait.until(lambda d: d.execute_script("return typeof ProjectService !== 'undefined' && typeof uploadProject === 'function' && typeof USER_PROJECT !== 'undefined' && USER_PROJECT !== null"))
                  driver.execute_script("""
                    let old=document.getElementById('fileToUpload'); if(old) old.remove();
                    let el=document.createElement('input'); el.type='file'; el.id='fileToUpload';
                    document.body.appendChild(el);
                  """)
                  file_input=driver.find_element(By.ID,'fileToUpload')
                  file_input.send_keys(str(test.resolve()))
                  driver.execute_script('uploadProject();')
                  wait.until(lambda d: d.execute_script("return USER_PROJECT && USER_PROJECT.project && USER_PROJECT.project.projectDetails && USER_PROJECT.project.projectDetails.title && USER_PROJECT.project.projectDetails.title.value") == 'REVEX COMCHECK LIVE QA')
                  print('REVEX_COMCHECK_BROWSER_UPLOAD=PASSED')

                  calc=driver.execute_async_script("""
                    const done = arguments[arguments.length - 1];
                    ProjectService.calculateEnvelopeCompliance(true, function(r) {
                      try {
                        const s = r && r.envelopeStatus ? r.envelopeStatus : r;
                        done(JSON.stringify({ok:true, passes:s && s.passes, complianceIndex:s && s.complianceIndex}));
                      } catch (e) { done(JSON.stringify({ok:false,error:String(e)})); }
                    });
                  """)
                  print('REVEX_COMCHECK_BROWSER_CALC=',calc)
                  if '"ok":true' not in calc.replace(' ',''):
                      raise RuntimeError('COMcheck browser calculation callback failed: '+str(calc))

                  report_url=base+'report.html?envelopeCertificate=true&intLightingCertificate=false&extLightingCertificate=false&mechanicalCertificate=false&mechanicalReqDescription=false'
                  driver.get(report_url)
                  wait.until(lambda d: 'report/current/pdf' in d.page_source)
                  cookies='; '.join(f"{c['name']}={c['value']}" for c in driver.get_cookies())
                  ua=driver.execute_script('return navigator.userAgent')
                  req=urllib.request.Request(base+'report/current/pdf',headers={'Cookie':cookies,'User-Agent':ua,'Referer':report_url})
                  pdf=urllib.request.urlopen(req,timeout=45).read()
                  if not pdf.startswith(b'%PDF-'):
                      raise RuntimeError('Official COMcheck browser-session report endpoint did not return PDF')
                  print('REVEX_COMCHECK_BROWSER_PDF=PASSED')
                  print('REVEX_COMCHECK_BROWSER_PDF_BYTES=',len(pdf))
              finally:
                  driver.quit()
