name: REVEX COMcheck wire inspect
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium pypdf
      - name: Inspect fresh-project COMcheck controls
        shell: python
        run: |
          import json
          from selenium import webdriver
          from selenium.webdriver.support.ui import WebDriverWait
          base='https://legacy-comcheck.energycode.pnl.gov/CheckWeb/'
          o=webdriver.ChromeOptions();o.add_argument('--headless=new');o.add_argument('--no-sandbox');o.add_argument('--disable-dev-shm-usage')
          d=webdriver.Chrome(options=o)
          try:
              w=WebDriverWait(d,45);d.get(base+'index.html');w.until(lambda x:x.execute_script("return typeof USER_PROJECT!=='undefined' && USER_PROJECT!==null"))
              print('SELECTS=',json.dumps(d.execute_script("return Array.from(document.querySelectorAll('select')).map(e=>({id:e.id,name:e.name,value:e.value,html:e.outerHTML.slice(0,5000),options:Array.from(e.options).map(o=>({text:o.text,value:o.value})).filter(o=>/new york|nyc|2020|appendix|90\.1/i.test(o.text+' '+o.value))}))"),indent=2))
              print('INPUTS=',json.dumps(d.execute_script("return Array.from(document.querySelectorAll('input,button,a')).map(e=>({tag:e.tagName,id:e.id,name:e.name,type:e.type,value:e.value,text:(e.innerText||e.title||'').trim(),onclick:e.getAttribute('onclick')})).filter(x=>/project title|height|stor|building|area|wall|roof|floor|window|door|compliance|report/i.test(JSON.stringify(x))).slice(0,200)"),indent=2))
              print('GLOBALS=',d.execute_script("return Object.keys(window).filter(k=>/code|location|envelope|wall|roof|floor|window|door|building|compliance/i.test(k)).sort().slice(0,300).join(' | ')"))
          finally:d.quit()
