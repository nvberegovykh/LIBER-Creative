name: REVEX COMcheck wire inspect
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Live schema-intact COMcheck upload calculation and PDF
        shell: python
        run: |
          import importlib.util, pathlib, sys, tempfile, xml.etree.ElementTree as ET
          energy=pathlib.Path('src/Liber.Revex.Revit/Engineering/Energy')
          spec=importlib.util.spec_from_file_location('cc', energy/'comcheck_backstop.py')
          cc=importlib.util.module_from_spec(spec); sys.modules['cc']=cc; spec.loader.exec_module(cc)
          reference=energy/'References'/'COMcheck_250_MIDWOOD_STRUCTURE_REFERENCE.cxl'
          with tempfile.TemporaryDirectory() as td:
              folder=pathlib.Path(td)
              test=folder/'REVEX_COMCHECK_SCHEMA_INTACT_QA.cxl'
              tree=ET.parse(reference); root=tree.getroot()
              values={
                'projectTitle':'REVEX COMCHECK LIVE QA',
                'projectAddress':'999 TEST AVENUE',
                'projectCity':'BROOKLYN',
                'projectState':'New York',
                'projectZipCode':'11201',
              }
              for node in root.iter():
                  local=node.tag.rsplit('}',1)[-1]
                  if local in values: node.text=values[local]
              tree.write(test, encoding='utf-8', xml_declaration=True)
              events=[]
              c=cc.ComcheckClient(cc.DEFAULT_BASE_URL, lambda event, **detail: events.append((event,detail)), timeout_seconds=30)
              c.start()
              c.upload_project(test)
              evidence=folder/'response.js'
              summary=c.calculate_backstop(evidence)
              report=folder/'report.pdf'
              c.download_report(report)
              if not report.read_bytes().startswith(b'%PDF-'):
                  raise RuntimeError('COMcheck live schema-intact report is not PDF')
              print('REVEX_COMCHECK_SCHEMA_INTACT_UPLOAD=PASSED')
              print('REVEX_COMCHECK_SCHEMA_INTACT_CALC=PASSED')
              print('REVEX_COMCHECK_SCHEMA_INTACT_PDF=PASSED')
              print('REVEX_COMCHECK_SCHEMA_INTACT_PDF_BYTES=',report.stat().st_size)
              print('REVEX_COMCHECK_SCHEMA_INTACT_SUMMARY=',summary)
