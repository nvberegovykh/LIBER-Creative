name: REVEX r109 pure responsive UI validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/liber-apps/apps/revex/ui-integrity.js'
      - 'docs/liber-apps/apps/revex/ui-polish-r109.js'
      - 'docs/liber-apps/apps/revex/mobile-final-r122.js'
      - 'docs/liber-apps/apps/revex/docs-pages-r115.js'
      - 'docs/liber-apps/apps/revex/sync-docs-r24.js'
      - 'docs/liber-apps/apps/revex/app.js'
      - '.github/scripts/verify-revex-r109-pure-ui.js'
      - '.github/workflows/revex-r109-pure-ui.yml'
  push:
    branches: [main]
    paths:
      - 'docs/liber-apps/apps/revex/ui-integrity.js'
      - 'docs/liber-apps/apps/revex/ui-polish-r109.js'
      - 'docs/liber-apps/apps/revex/mobile-final-r122.js'
      - 'docs/liber-apps/apps/revex/docs-pages-r115.js'
      - 'docs/liber-apps/apps/revex/sync-docs-r24.js'
      - 'docs/liber-apps/apps/revex/app.js'
      - '.github/scripts/verify-revex-r109-pure-ui.js'
      - '.github/workflows/revex-r109-pure-ui.yml'

permissions:
  contents: read

jobs:
  pure-ui-r109:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check responsive UI
        run: |
          node --check docs/liber-apps/apps/revex/ui-polish-r109.js
          node --check docs/liber-apps/apps/revex/mobile-final-r122.js
          node --check docs/liber-apps/apps/revex/ui-integrity.js
      - name: Verify r122 mobile ownership contract
        run: |
          grep -F "mobile-final-r122.js?v=20260817r122-mobile-final1" docs/liber-apps/apps/revex/ui-integrity.js
          grep -F "typeof v.walkOn==='function'" docs/liber-apps/apps/revex/mobile-final-r122.js
          grep -F ".view[hidden],.empty-view[hidden]{display:none!important}" docs/liber-apps/apps/revex/mobile-final-r122.js
          grep -F "docsPdfOwner:'r115'" docs/liber-apps/apps/revex/mobile-final-r122.js
          grep -F "derivedFromFullSet=true" docs/liber-apps/apps/revex/mobile-final-r122.js
      - name: Verify desktop parity, touch Walk, linked Docs and Energy preservation
        run: node .github/scripts/verify-revex-r109-pure-ui.js
