name: Observer public Firebase deploy validation

on:
  push:
    branches: [main]
    paths:
      - 'DEPLOY_OBSERVER_PUBLIC_FIREBASE_CURRENT.ps1'
      - 'DEPLOY_OBSERVER_PUBLIC_FIREBASE_CURRENT.cmd'
      - 'RUN_OBSERVER_PUBLIC_FIREBASE_CURRENT.cmd'
      - 'docs/ai/public-manifest.json'
      - '.github/workflows/observer-public-firebase-deploy-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'DEPLOY_OBSERVER_PUBLIC_FIREBASE_CURRENT.ps1'),[ref]$tokens,[ref]$errors)
          if(@($errors).Count -gt 0){ $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Host 'OBSERVER_FIREBASE_PS_SYNTAX=PASSED'
      - name: Surgical deployment contract
        shell: pwsh
        run: |
          $text=Get-Content -Raw DEPLOY_OBSERVER_PUBLIC_FIREBASE_CURRENT.ps1
          foreach($marker in @(
            'versions:clone',
            'channels/live',
            'sourceVersion=$SourceVersion',
            'finalize=$false',
            'populateFiles',
            'Preview passed.',
            'Automatic rollback after Observer public counter verification failure',
            "[ValidateSet('AUDIT','APPLY')]",
            '/observer-ai.html',
            '/liber-ai.json',
            '/observer-ai-guide.json',
            'liber.ai.public-manifest.v1',
            'Public AI manifest loaded:',
            '/ai/cases/meadowview-palladian-r1.json',
            '/ai/runtime/dependency-graph-r1.js',
            'forbidden ghost',
            "'x-goog-user-project' = `$ProjectId",
            '-Headers (Firebase-Headers)',
            '$DomainMatches = [System.Collections.Generic.List[object]]::new()',
            '.EndsWith($expectedSuffix,[System.StringComparison]::OrdinalIgnoreCase)',
            'function Get-FinalizedVersionState',
            '$final = Get-FinalizedVersionState $CloneVersion',
            '$PreviewChannelCreated = $false',
            '$populateProps = @($populate.PSObject.Properties.Name)',
            '$required = @()',
            "`$populateProps -contains 'uploadRequiredHashes'",
            'Firebase populateFiles requested uploads but returned no uploadUrl.',
            'Patch manifest contains an empty hash (Firebase deletion marker)',
            "`$finalProps -contains 'fileCount'",
            'Firebase omitted fileCount. Preservation remains gated by exact live-version clone + non-empty overlay manifest + preview verification.'
          )) { if(-not $text.Contains($marker)){ throw "Missing surgical-deploy marker: $marker" } }
          if($text -match 'firebase\s+deploy\s+--only\s+hosting'){ throw 'Whole-site firebase deploy is forbidden in the surgical controller.' }
          if($text -match '(?im)^\s*\$matches\s*='){ throw 'Do not use PowerShell automatic $Matches as a mutable collection.' }
          if($text.Contains('$finalPatch.fileCount')){ throw 'Do not trust fileCount on the PATCH response; re-read finalized version metadata first.' }
          if($text.Contains('Finalized version metadata did not expose fileCount')){ throw 'Finalized status must not depend on optional aggregate counters.' }
          if($text -match '(?im)^\s*\$populate\s*=.*populateFiles.*\r?\n\s*\$required\s*=\s*@\(\$populate\.uploadRequiredHashes\)\s*$'){ throw 'uploadRequiredHashes is optional; guard property existence under StrictMode.' }
          $launcher=Get-Content -Raw RUN_OBSERVER_PUBLIC_FIREBASE_CURRENT.cmd
          foreach($marker in @('git clone --filter=blob:none --depth 1','DEPLOY_OBSERVER_PUBLIC_FIREBASE_CURRENT.cmd','Current main:')) {
            if(-not $launcher.Contains($marker)){ throw "Missing from-anywhere launcher marker: $marker" }
          }
          Write-Host 'OBSERVER_FIREBASE_SURGICAL_CONTRACT=PASSED'
