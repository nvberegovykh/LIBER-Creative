name: REVEX live public-source parity

on:
  pull_request:
    branches: [main]
    paths:
      - 'AI_START_HERE.md'
      - 'docs/.well-known/liber-ai.json'
      - 'docs/liber-apps/apps/revex/**'
      - '.github/scripts/verify-revex-live-public-parity.py'
      - '.github/workflows/revex-live-public-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-runtime-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare public REVEX owners with liberpict.com
        run: python .github/scripts/verify-revex-live-public-parity.py
