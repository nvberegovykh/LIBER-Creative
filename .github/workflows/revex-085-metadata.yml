name: REVEX 0.8.5 metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/revex-085-metadata.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align LIBER Apps REVEX metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('docs/liber-apps/js/apps.js')
          s = p.read_text(encoding='utf-8')
          pat = re.compile(r"(id:\s*'revex'[\s\S]{0,700}?version:\s*')[^']+('[\s\S]{0,700}?lastUpdated:\s*')[^']+(')")
          out, n = pat.subn(r"\g<1>0.8.5\g<2>2026-08-10\g<3>", s, count=1)
          if n != 1:
              raise SystemExit('REVEX metadata block not found exactly once')
          p.write_text(out, encoding='utf-8')
          PY
          grep -q "id: 'revex'" docs/liber-apps/js/apps.js
          grep -q "version: '0.8.5'" docs/liber-apps/js/apps.js
          grep -q '20260810r24' docs/liber-apps/apps/revex/index.html
      - name: Commit metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'REVEX release bot'
          git config user.email 'revex-release@users.noreply.github.com'
          git add docs/liber-apps/js/apps.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'REVEX 0.8.5 engineering release metadata'
          git push origin HEAD:main
