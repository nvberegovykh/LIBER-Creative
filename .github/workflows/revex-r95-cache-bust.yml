name: REVEX r95 cache-bust apply

on:
  push:
    branches: ['agent/revex-r95-cache-bust']
    paths: ['.github/workflows/revex-r95-cache-bust.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/revex-r95-cache-bust
      - name: Replace only the r95 UI-integrity cache key
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('docs/liber-apps/apps/revex/index.html')
          t=p.read_text(encoding='utf-8')
          old='ui-integrity.js?v=20260816r89-identity-en1'
          new='ui-integrity.js?v=20260816r95-single-owner1'
          if t.count(old)!=1:
              raise SystemExit(f'expected one old cache key, found {t.count(old)}')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          Path('.github/workflows/revex-r95-cache-bust.yml').unlink()
          PY
          grep -q 'ui-integrity.js?v=20260816r95-single-owner1' docs/liber-apps/apps/revex/index.html
          ! grep -q 'ui-integrity.js?v=20260816r89-identity-en1' docs/liber-apps/apps/revex/index.html
      - name: Commit cache-bust
        run: |
          git config user.name 'REVEX r95 cache integrity'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'REVEX r95: force WebView to load single-owner runtime [skip ci]'
          git push origin HEAD:agent/revex-r95-cache-bust
