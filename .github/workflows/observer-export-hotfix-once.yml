name: Observer export hotfix once

# One-shot trigger refresh: 2026-09-17T18:49Z
on:
  push:
    paths:
      - '.github/workflows/observer-export-hotfix-once.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Repair export clobber
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server/firebase-functions/observer-agent-broker.js')
          s=p.read_text(encoding='utf-8')
          old="module.exports = { PROJECT_SCOPES, PUBLIC_SCOPES };"
          new="module.exports.PROJECT_SCOPES = PROJECT_SCOPES;\nmodule.exports.PUBLIC_SCOPES = PUBLIC_SCOPES;"
          if old not in s:
              raise SystemExit('Expected Observer export-clobber line was not found; refusing blind patch.')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Install exact runtime dependencies
        working-directory: server/firebase-functions
        run: npm install --omit=dev --no-audit --no-fund
      - name: Prove composed exports under Node 22
        working-directory: server/firebase-functions
        run: |
          node --check observer-agent-broker.js
          node --check main.js
          node - <<'NODE'
          const m=require('./main.js');
          const required=['issueRevexObserverAnonymousClaim','issueRevexObserverPairCode','claimRevexObserverAgentSession','pullRevexObserverAgentRequests','completeRevexObserverAgentRequest','revexObserverMcp'];
          const missing=required.filter(k=>typeof m[k]!=='function');
          if(missing.length) throw new Error('missing Observer exports: '+missing.join(','));
          console.log('REVEX_OBSERVER_COMPOSED_EXPORTS=PASSED '+required.join(','));
          NODE
      - name: Commit verified hotfix and remove one-shot workflow
        run: |
          git config user.name 'LIBER Observer Hotfix'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/observer-export-hotfix-once.yml
          git add server/firebase-functions/observer-agent-broker.js
          if [ -f server/firebase-functions/package-lock.json ]; then git add server/firebase-functions/package-lock.json; fi
          git commit -m 'Fix Observer broker export clobber after runtime verification'
          git push origin HEAD:main
