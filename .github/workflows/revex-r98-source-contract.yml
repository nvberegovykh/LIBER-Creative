name: REVEX r98 source boundary

on:
  pull_request:
    paths:
      - 'server/revex-energy-worker/**'
      - 'REPAIR_REVEX_ENERGY_VERTEX_BINDING_CURRENT.*'
      - '.github/scripts/verify-revex-r98-*.js'
      - '.github/workflows/revex-r98-source-contract.yml'

permissions:
  contents: read

jobs:
  source-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/scripts/verify-revex-r98-source-contract.js
      - run: node .github/scripts/verify-revex-r98-deploy-noqa.js
      - run: node .github/scripts/verify-revex-r98-fast-repair.js
      - run: node .github/scripts/verify-revex-r98-runtime-boundary.js
