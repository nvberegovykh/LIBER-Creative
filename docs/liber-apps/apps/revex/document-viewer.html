<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project document</title><link rel="stylesheet" href="document-viewer.css?v=20260914r192-morning1"></head><body>
<header aria-label="Document tools"><div class="pager"><button id="previous" aria-label="Previous page">‹</button><label>Page <input id="page" type="number" value="1" min="1" aria-label="Page number"></label><span id="total">/ 1</span><button id="next" aria-label="Next page">›</button></div><button id="zoom-out" aria-label="Zoom out">−</button><output id="zoom">Fit</output><button id="zoom-in" aria-label="Zoom in">+</button><button id="fit">Fit</button><button id="rotate">Rotate</button><button id="text-toggle" aria-pressed="false">Page text</button><a id="original" target="_blank" rel="noopener noreferrer">Open original ↗</a></header>
<section class="measure-tools" aria-label="Drawing measurements"><button id="calibrate">Calibrate</button><label id="calibration-input" hidden>Known length <input id="known-length" type="number" min="0" step="any" aria-label="Known length"><select id="unit" aria-label="Measurement unit"><option>ft</option><option>m</option><option>mm</option><option>in</option></select><button id="apply-scale">Apply scale</button></label><button id="measure" disabled aria-pressed="false">Measure</button><button id="clear-measurements" disabled>Clear measurements</button><span id="measure-hint">Calibrate from a known dimension on this page.</span></section>
<p id="status" role="status" aria-live="polite">Select a project document.</p><main id="viewport" tabindex="0" aria-label="Document page"><div id="paper"><div id="page-content"></div><svg id="measure-overlay" aria-label="Measurement drawing area"></svg></div><pre id="page-text" hidden tabindex="0"></pre></main><ol id="measurements" aria-label="Measurements"></ol><script type="module" src="document-viewer.js?v=20260914r192-morning1"></script></body></html>
