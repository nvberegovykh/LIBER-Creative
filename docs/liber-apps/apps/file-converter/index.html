<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>File Converter</title>
  <link rel="stylesheet" href="../../css/style.css?v=20260914r192-morning1" />
  <style>
    body{background:var(--primary-bg,#000);color:var(--primary-text,#eaeaea);font-family:var(--app-font,"Courier Prime","Courier New","Lucida Console",monospace)}
    .wrap{max-width:900px;margin:0 auto;padding:16px;padding-top:max(16px,env(safe-area-inset-top))}
    .panel{border:1px solid var(--border-color,#2b2f38);border-radius:12px;padding:16px;background:var(--secondary-bg,#0e1014);margin:12px 0}
    .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
    .row>*>*{max-width:100%}
    label{display:block;margin-bottom:6px;opacity:.9}
    select,button,input{background:#161a22;border:1px solid #2b2f38;color:#fff;border-radius:8px;padding:10px}
    .out{white-space:pre-wrap;background:#0b0e12;border-radius:8px;padding:12px;border:1px dashed #2b2f38}
  </style>
</head>
<body>
  <!-- R163_FFMPEG_SINGLE_THREAD_0_11: @ffmpeg/ffmpeg 0.11.6 + @ffmpeg/core-st 0.11.1 -->
  <div class="wrap">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
      <h2>File Converter</h2>
      <button id="back-to-cp" style="background:#1b2330;border:1px solid #2b2f38;color:#fff;border-radius:8px;padding:8px 12px">Back to Control Panel</button>
    </div>
    <div class="panel">
      <div class="row">
        <div style="flex:1 1 260px">
          <label for="file-input">Select file</label>
          <input id="file-input" type="file" />
        </div>
        <div style="flex:1 1 180px">
          <label for="type-select">Type</label>
          <select id="type-select">
            <option value="auto">Auto-detect</option>
            <option value="image">Image</option>
            <option value="audio">Audio</option>
            <option value="video">Video</option>
          </select>
        </div>
        <div style="flex:1 1 200px">
          <label for="format-select">Target format</label>
          <select id="format-select">
            <optgroup label="Image">
              <option value="png">PNG</option>
              <option value="jpg">JPG</option>
              <option value="webp">WEBP</option>
              <option value="bmp">BMP</option>
              <option value="tiff">TIFF</option>
              <option value="gif">GIF</option>
              <option value="ico">ICO</option>
              <option value="svg">SVG (vectorize)</option>
              <option value="pdf">PDF (single page)</option>
            </optgroup>
            <optgroup label="Audio">
              <option value="wav">WAV</option>
              <option value="mp3">MP3</option>
              <option value="ogg">OGG</option>
              <option value="flac">FLAC</option>
              <option value="aac">AAC</option>
              <option value="m4a">M4A</option>
            </optgroup>
            <optgroup label="Video">
              <option value="mp4">MP4 (H.264/AAC)</option>
              <option value="webm">WEBM (VP9/Opus)</option>
              <option value="avi">AVI</option>
              <option value="mov">MOV</option>
              <option value="mkv">MKV</option>
              <option value="gifv">Animated GIF</option>
            </optgroup>
          </select>
        </div>
        <div>
          <label>&nbsp;</label>
          <button id="convert-btn">Convert</button>
        </div>
      </div>
      <div id="progress" style="margin-top:12px;opacity:.9"></div>
      <div id="output" class="out" style="margin-top:12px"></div>
    </div>
    <p style="opacity:.7">Powered by ffmpeg.wasm (client-side). Some conversions may be CPU intensive on mobile.</p>
  </div>

  <script>
    // R163: load one compatible wrapper at a time. Concurrent CDN copies can race and
    // leave a half-initialized FFmpeg namespace; the fallback is intentionally sequential.
    (function(){
      const loadScript=(src)=>new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.async=true;s.crossOrigin='anonymous';s.onload=()=>resolve(src);s.onerror=()=>{s.remove();reject(new Error('Could not load '+src))};document.head.appendChild(s)});
      const wrapperUrls=['https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js','https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js'];
      let wrapperPromise=null;
      window.waitForFFmpeg=function waitForFFmpeg(){
        if(window.FFmpeg?.createFFmpeg)return Promise.resolve(window.FFmpeg);
        if(wrapperPromise)return wrapperPromise;
        // Share an in-flight attempt, but let the next click retry after a
        // temporary CDN failure. A successful wrapper lives on window.FFmpeg.
        wrapperPromise=(async()=>{let last=null;for(const src of wrapperUrls){try{await loadScript(src);if(window.FFmpeg?.createFFmpeg)return window.FFmpeg;last=new Error('FFmpeg wrapper loaded without createFFmpeg: '+src)}catch(error){last=error}}console.error(last);return null})().finally(()=>{wrapperPromise=null;});
        return wrapperPromise;
      };
      if(!window.ImageTracer){void loadScript('https://unpkg.com/imagetracerjs@1.2.6/imagetracer_v1.2.6.js').catch(()=>{});}
    })();
  </script>
  <script>
    // Back button logic: focus existing dashboard tab if opened from it; else navigate
    (function(){
      const back = document.getElementById('back-to-cp');
      if (back){
        back.addEventListener('click', (e)=>{
          e.preventDefault();
          try{
            if (window.opener && !window.opener.closed){ try{ window.opener.focus(); }catch(_){} try{ window.close(); }catch(_){} return; }
          }catch(_){ }
          window.location.href='../../index.html#apps';
        });
      }
    })();

    let ffmpeg;
    const el = (id)=> document.getElementById(id);

    const detectType = (file)=>{
      const t = (file.type||'').toLowerCase();
      if (t.startsWith('image/')) return 'image';
      if (t.startsWith('audio/')) return 'audio';
      if (t.startsWith('video/')) return 'video';
      return 'auto';
    };

    async function ensureFFmpeg(){
      if (!ffmpeg){
        const mod = await window.waitForFFmpeg();
        if (!mod){ throw new Error('FFmpeg failed to load'); }
        const { createFFmpeg } = mod;
        const candidates = [
          'https://cdn.jsdelivr.net/npm/@ffmpeg/core-st@0.11.1/dist/ffmpeg-core.js',
          'https://unpkg.com/@ffmpeg/core-st@0.11.1/dist/ffmpeg-core.js'
        ];
        let lastErr = null;
        for (const corePath of candidates){
          let inst = null;
          try{
            inst = createFFmpeg({ log: true, mainName: 'main', corePath });
            el('progress').textContent = 'Loading FFmpeg...';
            await inst.load();
            ffmpeg = inst; lastErr = null; break;
          }catch(e){ try { inst?.exit?.(); } catch(_) {} lastErr = e; }
        }
        if (!ffmpeg){
          throw lastErr || new Error('FFmpeg failed to load');
        }
      } else if (!ffmpeg.isLoaded()) {
        el('progress').textContent = 'Loading converter...';
        await ffmpeg.load();
      }
    }

    function downloadBlob(blob, name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 5000); }

    async function imageBitmap(input){
      try { return await createImageBitmap(input); }
      catch (originalError) {
        // Some browsers do not support SVG through createImageBitmap.
        if (input.type !== 'image/svg+xml') throw originalError;
        const url=URL.createObjectURL(input);
        try { return await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('Could not decode the SVG image.'));img.src=url;}); }
        finally { URL.revokeObjectURL(url); }
      }
    }

    async function convertImageToPdf(input,outName){
      const bitmap=await imageBitmap(input);
      try {
        const width=bitmap.width||bitmap.naturalWidth, height=bitmap.height||bitmap.naturalHeight;
        if (!width || !height || width*height>40000000) throw new Error('Use an image no larger than 40 megapixels.');
        const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
        const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);ctx.drawImage(bitmap,0,0);
        const jpeg=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('Could not encode the image.')),'image/jpeg',0.94));
        const bytes=new Uint8Array(await jpeg.arrayBuffer()), enc=new TextEncoder(), parts=[], offsets=[0];let length=0;
        const append=value=>{const chunk=typeof value==='string'?enc.encode(value):value;parts.push(chunk);length+=chunk.length;};
        const object=(id,body)=>{offsets[id]=length;append(`${id} 0 obj\n${body}\nendobj\n`);};
        const pageWidth=width>height?842:595,pageHeight=width>height?595:842;
        const scale=Math.min((pageWidth-48)/width,(pageHeight-48)/height);
        const w=width*scale,h=height*scale;
        const commands=`q ${w.toFixed(3)} 0 0 ${h.toFixed(3)} ${((pageWidth-w)/2).toFixed(3)} ${((pageHeight-h)/2).toFixed(3)} cm /Im0 Do Q\n`;
        append('%PDF-1.4\n');
        object(1,'<< /Type /Catalog /Pages 2 0 R >>');
        object(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
        object(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageWidth} ${pageHeight}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
        offsets[4]=length;append(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${width} /Height ${height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bytes.length} >>\nstream\n`);append(bytes);append('\nendstream\nendobj\n');
        object(5,`<< /Length ${enc.encode(commands).length} >>\nstream\n${commands}endstream`);
        const xref=length;append('xref\n0 6\n0000000000 65535 f \n');
        for(let i=1;i<=5;i++)append(String(offsets[i]).padStart(10,'0')+' 00000 n \n');
        append(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
        downloadBlob(new Blob(parts,{type:'application/pdf'}),outName);
        el('output').textContent='Done: '+outName;el('progress').textContent='';
      } finally { bitmap.close?.(); }
    }

    async function convertRasterInBrowser(input, target, outName){
      if (!['jpg','jpeg','png','webp'].includes(String(target).toLowerCase())) return false;
      const bitmap = await imageBitmap(input);
      try {
        const canvas = document.createElement('canvas');
        canvas.width = bitmap.width; canvas.height = bitmap.height;
        const ctx = canvas.getContext('2d', { alpha: target !== 'jpg' && target !== 'jpeg' });
        if (target === 'jpg' || target === 'jpeg'){ ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height); }
        ctx.drawImage(bitmap,0,0);
        const mime = (target === 'jpg' || target === 'jpeg') ? 'image/jpeg' : `image/${target}`;
        const blob = await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('Browser image conversion failed.')),mime,0.94));
        downloadBlob(blob,outName);
        el('output').textContent = 'Done: ' + outName + ' (' + (blob.size/1024).toFixed(1) + ' KB)';
        el('progress').textContent = '';
        return true;
      } finally { bitmap.close?.(); }
    }

    document.getElementById('convert-btn').onclick = async()=>{
      const input = el('file-input').files[0];
      if (!input){ alert('Choose a file'); return; }
      const kind = (el('type-select').value==='auto') ? detectType(input) : el('type-select').value;
      const target = el('format-select').value;
      const inName = 'input.' + (input.name.split('.').pop()||'dat');
      const outName = 'output.' + (target==='gifv'?'gif':target);
      const button=el('convert-btn');
      if(button.disabled)return;
      button.disabled=true;el('output').textContent='';el('progress').textContent='Preparing conversion...';
      try{
        const formats={image:['jpg','png','webp','bmp','tiff','gif','ico','svg','pdf'],audio:['wav','mp3','ogg','flac','aac','m4a'],video:['mp4','webm','avi','mov','mkv','gifv','gif']};
        if(formats[kind]&&!formats[kind].includes(target))throw new Error('Choose a '+kind+' output format for this file.');
        if(kind==='image'&&target==='pdf'){await convertImageToPdf(input,outName);return;}
        // Browser-native image conversion is faster and does not depend on ffmpeg.wasm.
        if (kind==='image' && await convertRasterInBrowser(input,target,outName)) return;
        // Special handling for SVG vector output without ffmpeg
        if (kind==='image' && target==='svg'){
          el('progress').textContent = 'Vectorizing to SVG...';
          // Keep the one conversion owner until decoding and vectorization
          // finish. Detached image callbacks previously released it too early.
          const bitmap = await imageBitmap(input);
          try {
            const canvas = document.createElement('canvas');
            canvas.width = bitmap.width || bitmap.naturalWidth;
            canvas.height = bitmap.height || bitmap.naturalHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(bitmap, 0, 0);
            const imdata = ctx.getImageData(0, 0, canvas.width, canvas.height);
            if (!window.ImageTracer?.imagedataToSVG) throw new Error('SVG vectorizer unavailable');
            const svgstr = window.ImageTracer.imagedataToSVG(imdata, { ltres:1, qtres:1, pathomit:8 });
            downloadBlob(new Blob([svgstr], { type:'image/svg+xml' }), outName);
            el('output').textContent = 'Done: ' + outName;
            el('progress').textContent = '';
          } finally { bitmap.close?.(); }
          return;
        }

        await ensureFFmpeg();
        el('progress').textContent = 'Running conversion...';
        const { fetchFile } = window.FFmpeg;
        ffmpeg.FS('writeFile', inName, await fetchFile(input));
        let args = [];
        if (kind==='image'){
          args = ['-i', inName, outName];
        } else if (kind==='audio'){
          if (target==='mp3') args = ['-i', inName, '-b:a', '192k', outName];
          else if (target==='aac' || target==='m4a') args = ['-i', inName, '-c:a', 'aac', '-b:a','192k', outName];
          else if (target==='flac') args = ['-i', inName, '-c:a','flac', outName];
          else args = ['-i', inName, outName];
        } else if (kind==='video'){
          if (target==='mp4') args = ['-i', inName, '-c:v', 'libx264', '-preset', 'veryfast', '-c:a', 'aac', outName];
          else if (target==='webm') args = ['-i', inName, '-c:v', 'libvpx-vp9', '-b:v', '0', '-crf', '30', '-c:a', 'libopus', outName];
          else if (target==='avi') args = ['-i', inName, '-c:v', 'mpeg4', '-qscale:v', '3', '-c:a', 'mp2', outName];
          else if (target==='gifv' || target==='gif') args = ['-i', inName, '-vf','fps=12,scale=640:-1:flags=lanczos', outName];
          else args = ['-i', inName, outName];
        } else { args = ['-i', inName, outName]; }
        await ffmpeg.run('-y',...args);
        const data = ffmpeg.FS('readFile', outName);
        const outputMime = { jpg:'image/jpeg', png:'image/png', webp:'image/webp', bmp:'image/bmp', tiff:'image/tiff', gif:'image/gif', gifv:'image/gif', ico:'image/vnd.microsoft.icon', wav:'audio/wav', mp3:'audio/mpeg', ogg:'audio/ogg', flac:'audio/flac', aac:'audio/aac', m4a:'audio/mp4', mp4:'video/mp4', webm:'video/webm', avi:'video/x-msvideo', mov:'video/quicktime', mkv:'video/x-matroska' };
        const blob = new Blob([data], { type: outputMime[target] || 'application/octet-stream' });
        downloadBlob(blob, outName);
        el('output').textContent = 'Done: ' + outName + ' (' + (blob.size/1024).toFixed(1) + ' KB)';
        el('progress').textContent = '';
      }catch(e){
        console.error(e); el('progress').textContent = 'Conversion failed';
        el('output').textContent = (e && e.message) || String(e);
      }finally{
        button.disabled=false;
        if(ffmpeg?.isLoaded?.())for(const name of [inName,outName]){try{ffmpeg.FS('unlink',name);}catch(_){}}
        // The single-thread core terminates main(); use a fresh engine next time.
        try { ffmpeg?.exit?.(); } catch(_) {} ffmpeg=null;
      }
    };
  </script>
</body>
</html>
