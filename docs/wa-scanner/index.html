<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LIBER Monitor — WhatsApp Scanner</title>
  <link rel="icon" href="/public/liber avatar.ico" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#000;color:#eaeaea;font-family:"Courier Prime","Courier New","Lucida Console",monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
    .card{max-width:420px;width:100%;background:#0e1014;border:1px solid #2b2f38;border-radius:16px;padding:40px 32px;text-align:center}
    .logo{font-size:40px;margin-bottom:14px}
    h1{font-size:1.5rem;font-weight:700;margin-bottom:8px}
    p{color:#9aa3b0;font-size:0.9rem;line-height:1.65;margin-bottom:28px}
    .qr-wrap{background:#fff;border-radius:12px;padding:16px;display:inline-block;margin-bottom:20px}
    .qr-wrap img{display:block;width:180px;height:180px}
    .qr-label{color:#555;font-size:0.78rem;margin-bottom:28px}
    .badge{display:inline-block;background:#0d2a0d;color:#4caf50;border:1px solid #2d6a2d;border-radius:20px;font-size:0.72rem;padding:3px 12px;margin-bottom:16px}
    .meta{font-size:0.72rem;color:#333;margin-top:24px}
    .meta a{color:#444;text-decoration:none}
    .meta a:hover{color:#888}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">📱</div>
    <h1>LIBER Monitor</h1>
    <span class="badge">FREE · OPEN SOURCE · MIT</span>
    <p>WhatsApp chat scanner. Reads your chats twice a day, summarizes with AI, and sends urgent alerts directly to your WhatsApp. Your data never leaves your own deployment.</p>

    <div class="qr-wrap">
      <!-- QR code placeholder — replace src with actual deployed app URL QR once live -->
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=https://github.com/nvberegovykh/liber-whatsapp-monitor&bgcolor=ffffff&color=000000" alt="Scan to open LIBER Monitor" />
    </div>
    <div class="qr-label">Scan to open · or <a href="https://github.com/nvberegovykh/liber-whatsapp-monitor" style="color:#666;text-decoration:underline" target="_blank">view on GitHub</a></div>

    <div class="meta">
      LIBER Creative LLC 2026 · <a href="https://github.com/nvberegovykh/liber-whatsapp-monitor/blob/main/LICENSE" target="_blank">MIT License</a> · <a href="/">liberpict.com</a>
    </div>
  </div>
</body>
</html>
