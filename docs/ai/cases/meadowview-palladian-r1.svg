<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#f7f5ef"/>
  <style>
    .k{fill:none;stroke:#111820;stroke-width:8;stroke-linejoin:round;stroke-linecap:round}
    .thin{fill:none;stroke:#111820;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
    .c{fill:none;stroke:#c58c1b;stroke-width:10;stroke-linecap:round}
    .axis{fill:none;stroke:#60727d;stroke-width:6;stroke-dasharray:16 12;stroke-linecap:round}
    .txt{font: 28px ui-sans-serif,system-ui,sans-serif;fill:#111820}
    .small{font: 22px ui-sans-serif,system-ui,sans-serif;fill:#36424a}
    .ok{font: 24px ui-sans-serif,system-ui,sans-serif;fill:#176b3a;font-weight:700}
    .axislabel{font: 24px ui-sans-serif,system-ui,sans-serif;fill:#52636d;font-weight:700}
  </style>
  <text x="55" y="55" class="txt">LIBER/AI object-paper — Palladian teaching reference</text>
  <text x="55" y="92" class="small">One rigid object. Different projections. Do not rotate geometry to fit a picture.</text>

  <!-- Front projection -->
  <g transform="translate(90 150)">
    <text x="120" y="-20" class="txt">FRONT PROJECTION</text>
    <rect x="90" y="40" width="300" height="420" class="k"/>
    <path d="M90 110 Q240 -30 390 110" class="k"/>
    <line x1="240" y1="-5" x2="240" y2="40" class="k"/>
    <!-- four physical candles collapse to two visible axes -->
    <line x1="175" y1="235" x2="175" y2="380" class="c"/>
    <line x1="305" y1="235" x2="305" y2="380" class="c"/>
    <circle cx="175" cy="225" r="13" fill="#f0b84b"/>
    <circle cx="305" cy="225" r="13" fill="#f0b84b"/>
    <!-- center reference / symmetry axis; not a candle -->
    <line x1="240" y1="220" x2="240" y2="385" class="axis"/>
    <text x="95" y="510" class="ok">4 physical candles → 2 dominant visible axes</text>
    <text x="118" y="545" class="axislabel">center axis = reference / symmetry line</text>
  </g>

  <!-- Axonometric / 3/4 -->
  <g transform="translate(660 160)">
    <text x="85" y="-30" class="txt">AXONOMETRIC / 3⁄4 OBSERVATION</text>
    <polygon points="70,90 315,20 445,105 195,180" class="k"/>
    <polygon points="70,90 70,455 195,545 195,180" class="k"/>
    <polygon points="195,180 445,105 445,470 195,545" class="k"/>
    <line x1="260" y1="-5" x2="260" y2="92" class="k"/>
    <!-- four candles separated by depth -->
    <line x1="158" y1="250" x2="158" y2="395" class="c"/>
    <line x1="300" y1="207" x2="300" y2="352" class="c"/>
    <line x1="213" y1="305" x2="213" y2="450" class="c"/>
    <line x1="360" y1="260" x2="360" y2="405" class="c"/>
    <text x="95" y="595" class="ok">same object: all 4 candle axes separate</text>
    <text x="80" y="630" class="small">Axonometry is the broader class; isometry is one special case.</text>
  </g>

  <text x="60" y="690" class="small">Major-form constraints: single straight central hanger • facade-facing cage • frozen surroundings • center axis stays a reference line</text>
</svg>
