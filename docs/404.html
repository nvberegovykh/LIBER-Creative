<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Not Found</title>
  <script>
    (function(){
      var p=(location.pathname||'').replace(/\/+$/,'');
      if(p==='/ai'){
        location.replace('/observer-ai.html'+location.search+location.hash);
      }
    })();
  </script>
  <style>
    html,body{margin:0;min-height:100%;background:#fff;color:#000;font-family:"Exo 2",Arial,sans-serif;text-transform:uppercase}
    body{min-height:100vh;display:grid;place-items:start;padding:72px 10vw;box-sizing:border-box}
    main{max-width:900px}h3{font-size:18px;margin:0 0 4px}h1{font-size:96px;line-height:.95;margin:0 0 12px}h2{font-size:25px;line-height:1.1;margin:0}
  </style>
</head>
<body>
  <main>
    <h3>OOPS! PAGE NOT FOUND</h3>
    <h1>404</h1>
    <h2>WE ARE SORRY, BUT THE PAGE YOU REQUESTED WAS NOT FOUND</h2>
  </main>
</body>
</html>
